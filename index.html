<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hudi's Budget</title>
<meta name="description" content="Hudi's personal budget: money in jars, bills on autopilot, paychecks split with a tap, backed by Supabase.">
<meta name="theme-color" content="#ffd6e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: phone-first single column (max 720px), soft pastel cards, big safe-to-spend hero, 3 quick-action buttons, bottom tabs. */
:root{
  --bg:#fff3f7; --surface:#ffffff; --surface-2:#ffe6ee; --fg:#3f2633; --muted:#8c6d7c; --line:#f6d5e0;
  --accent:#e85c8e; --accent-deep:#c9376c; --accent-soft:#ffd6e3; --accent-fg:#ffffff;
  --ok:#2e9c6c; --ok-soft:#d5f5e5; --warn:#d8405c; --warn-soft:#ffe0e6;
  --p-pink:#ffd6e3; --p-lav:#e7ddff; --p-mint:#d4f5e6; --p-butter:#fff1c2; --p-peach:#ffdcc7; --p-sky:#d6ecff; --p-lilac:#f2dcff;
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,sans-serif;
  --radius:20px; --shadow:0 2px 6px rgba(201,55,108,.06),0 10px 24px rgba(201,55,108,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#241a20; --surface:#302329; --surface-2:#3d2b34; --fg:#fbeff4; --muted:#c5a3b3; --line:#4a3540;
  --accent:#ff8ab5; --accent-deep:#ff6aa1; --accent-soft:#4d2b3a; --accent-fg:#2a1119;
  --ok:#7fe0b0; --ok-soft:#1f4634; --warn:#ff8a9f; --warn-soft:#4a2630;
  --p-pink:#4d2b3a; --p-lav:#3b3152; --p-mint:#1f4634; --p-butter:#4a4126; --p-peach:#4a3426; --p-sky:#263d52; --p-lilac:#45304f;
  --shadow:0 2px 6px rgba(0,0,0,.3),0 10px 24px rgba(0,0,0,.3); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#241a20; --surface:#302329; --surface-2:#3d2b34; --fg:#fbeff4; --muted:#c5a3b3; --line:#4a3540;
  --accent:#ff8ab5; --accent-deep:#ff6aa1; --accent-soft:#4d2b3a; --accent-fg:#2a1119;
  --ok:#7fe0b0; --ok-soft:#1f4634; --warn:#ff8a9f; --warn-soft:#4a2630;
  --p-pink:#4d2b3a; --p-lav:#3b3152; --p-mint:#1f4634; --p-butter:#4a4126; --p-peach:#4a3426; --p-sky:#263d52; --p-lilac:#45304f;
  --shadow:0 2px 6px rgba(0,0,0,.3),0 10px 24px rgba(0,0,0,.3); color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;font-weight:600}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em;font-weight:600}
h1{font-size:1.6rem}
h2{font-size:1.2rem}
h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-deep)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.sub{font-size:.82rem;color:var(--muted);font-weight:600}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
[hidden]{display:none!important}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);
  padding-block:12px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top .row{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
header.top h1{flex:1 1 auto}
header.top h1 span{color:var(--accent)}
.monthpick{display:flex;align-items:center;gap:2px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:2px 4px}
.monthpick button{border:0;background:transparent;width:32px;height:32px;border-radius:999px;cursor:pointer;color:var(--accent-deep);font-size:1.1rem;font-weight:800}
.monthpick button:hover{background:var(--accent-soft)}
.monthpick .label{font-family:var(--display);font-weight:600;font-size:.95rem;min-width:82px;text-align:center}

/* Main */
main{max-width:720px;margin:0 auto;padding-block:8px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
section.view{display:grid;gap:16px}
.card{background:var(--surface);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card.tint{box-shadow:none}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card-head .actions{display:flex;gap:6px}

/* Hero */
.hero{background:linear-gradient(135deg,var(--p-pink),var(--p-lav));border-radius:28px;padding:22px 20px 18px;box-shadow:var(--shadow);display:grid;gap:4px}
.hero .big{font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.hero .big.neg{color:var(--warn)}
.hero .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--fg);opacity:.85;font-weight:700}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}.tiles.three{grid-template-columns:repeat(3,1fr)}}
.tile{border-radius:18px;padding:12px 14px;min-width:0;display:grid;gap:2px;align-content:start}
.tile .v{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:1.3rem;font-weight:700;line-height:1.15}
.tile .v.neg{color:var(--warn)}
.tile .sub{font-size:.76rem}
.t-pink{background:var(--p-pink)} .t-lav{background:var(--p-lav)} .t-mint{background:var(--p-mint)} .t-butter{background:var(--p-butter)} .t-peach{background:var(--p-peach)} .t-sky{background:var(--p-sky)} .t-lilac{background:var(--p-lilac)}

/* Quick actions */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick button{border:0;border-radius:18px;padding:14px 8px 12px;cursor:pointer;display:grid;justify-items:center;gap:6px;font-weight:800;font-size:.9rem;color:var(--fg);box-shadow:var(--shadow);background:var(--surface)}
.quick button span.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem}
.quick button:hover{transform:translateY(-1px)}
.quick .spent .ic{background:var(--p-pink)} .quick .paid .ic{background:var(--p-mint)} .quick .moved .ic{background:var(--p-sky)}

/* Pills */
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:800;letter-spacing:.03em;vertical-align:middle}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.over{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--p-lav);color:var(--fg)}
.pill.hist{background:var(--surface-2);color:var(--muted)}

/* Lists & rows */
.rows{display:grid}
.row-item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;border-bottom:2px solid var(--line);align-items:center}
.row-item:last-child{border-bottom:0}
.row-item.click{cursor:pointer;margin:0 -8px;padding-inline:8px;border-radius:12px}
.row-item.click:hover{background:var(--surface-2)}
.row-item .t{font-weight:800}
.row-item .d{font-size:.8rem;color:var(--muted);grid-column:1}
.row-item .a{font-variant-numeric:tabular-nums;font-weight:800;text-align:right;grid-row:1/3;align-self:center;font-size:1.02rem}
.row-item .a.in{color:var(--ok)} .row-item .a.xfer{color:var(--muted)}
.row-item .a .sub{display:block;font-size:.74rem;font-weight:700}
.bar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:6px;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;min-width:0}
.bar i.over{background:var(--warn)}
.bar i.soft{background:var(--accent-deep)}
.group-title{display:flex;align-items:center;gap:8px;margin:14px 0 2px;font-family:var(--display);font-size:.95rem}
.group-title:first-child{margin-top:0}
.group-title .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.daysep{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;padding:12px 0 2px}
.empty{color:var(--muted);font-size:.92rem;padding:8px 0}
table.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;padding:6px 6px;border-bottom:2px solid var(--line)}
.tbl td{padding:9px 6px;border-bottom:2px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.total td{font-weight:800;border-top:3px solid var(--line)}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.scrollx{overflow-x:auto;margin:0 -6px}

/* Jars */
.jars{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.jars{grid-template-columns:repeat(3,1fr)}}
.jar{border-radius:18px;padding:12px 12px 10px;cursor:pointer;display:grid;gap:4px;align-content:start;min-width:0;position:relative;overflow:hidden}
.jar .n{font-weight:800;font-size:.9rem;line-height:1.2}
.jar .v{font-family:var(--display);font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.jar .v.neg{color:var(--warn)}
.jar .fill{height:8px;border-radius:999px;background:rgba(255,255,255,.6);overflow:hidden}
.jar .fill i{display:block;height:100%;background:var(--accent);border-radius:999px}
.jar .sub{font-size:.74rem}
:root[data-theme="dark"] .jar .fill, :root:not([data-theme="light"]) .jar .fill{background:rgba(0,0,0,.25)}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]) .jar .fill{background:rgba(255,255,255,.6)} }
:root[data-theme="light"] .jar .fill{background:rgba(255,255,255,.6)}

/* Buttons & forms */
.btn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:800;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.danger{color:var(--warn);border-color:var(--warn-soft);background:var(--warn-soft)}
.btn.sm{padding:5px 11px;font-size:.8rem}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px solid var(--accent-soft);outline-offset:1px}
.field{display:grid;gap:5px}
.field label{font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select,.field textarea{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 12px;min-height:44px;font-weight:700}
.field input.big{font-family:var(--display);font-size:1.8rem;font-weight:700;min-height:60px;text-align:center}
.field textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
.toggle{display:flex;gap:6px;flex-wrap:wrap}
.toggle button{border:2px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:.85rem;font-weight:800}
.toggle button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.kind{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kind button{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 4px;cursor:pointer;display:grid;justify-items:center;gap:4px;font-size:.78rem;font-weight:800}
.kind button span{font-size:1.3rem}
.kind button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:800;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.check{display:flex;align-items:center;gap:10px;font-weight:700}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(63,38,51,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:640px){.modal{align-items:center;padding:20px}.modal .sheet{border-radius:26px}}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.modal .foot .spacer{flex:1}
.msg{border-radius:14px;padding:10px 12px;font-size:.9rem;background:var(--p-lav)}
.msg.err{background:var(--warn-soft);color:var(--warn)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:30;box-shadow:var(--shadow);font-weight:800}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--line);z-index:9;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
nav.tabs .row{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:transparent;padding:8px 4px 8px;cursor:pointer;color:var(--muted);display:grid;justify-items:center;gap:3px;font-size:.7rem;font-weight:800}
nav.tabs button span.ic{width:38px;height:28px;border-radius:999px;display:grid;place-items:center;font-size:1.15rem}
nav.tabs button[aria-current="page"]{color:var(--accent-deep)}
nav.tabs button[aria-current="page"] span.ic{background:var(--accent-soft)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;width:58px;height:58px;font-size:2rem;line-height:1;cursor:pointer;box-shadow:0 8px 20px rgba(201,55,108,.35);font-weight:700}
.fab:hover{background:var(--accent-deep)}

.chart svg{display:block;max-width:100%;font-family:var(--body)}

/* Auth */
.auth{max-width:420px;margin:10vh auto 0;display:grid;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth .brand{display:flex;align-items:center;gap:12px}
.auth .brand img{width:56px;height:56px;border-radius:16px}
.notes p{margin:0 0 10px;font-weight:600}
.notes b{font-family:var(--display);font-weight:600}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(14px);opacity:.5}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<div id="authView" class="auth" hidden>
  <div class="brand"><img src="apple-touch-icon.png" alt=""><div><h1>Hudi's Budget</h1><div class="sub">Your money, in one cute place</div></div></div>
  <form id="authForm" class="card" style="display:grid;gap:12px">
    <div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="username" required placeholder="you@example.com"></div>
    <div class="field"><label for="authPass">Password</label><input id="authPass" type="password" autocomplete="current-password" required minlength="6"></div>
    <div id="authMsg" class="msg" hidden></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" type="submit" id="btnSignIn">Sign in</button>
      <button class="btn" type="button" id="btnSignUp">Create account</button>
    </div>
    <div class="sub">Only your own emails can see this data.</div>
  </form>
</div>

<div id="appView" hidden>
  <header class="top"><div class="row">
    <h1 id="greeting">Hi <span>Hudi</span></h1>
    <div class="monthpick" aria-label="Month">
      <button id="prevMonth" type="button" aria-label="Previous month">‹</button>
      <div class="label" id="monthLabel">—</div>
      <button id="nextMonth" type="button" aria-label="Next month">›</button>
    </div>
  </div></header>

  <main>
    <div id="loadMsg" class="msg" hidden></div>
    <section class="view" id="view-home"></section>
    <section class="view" id="view-activity" hidden></section>
    <section class="view" id="view-jars" hidden></section>
    <section class="view" id="view-accounts" hidden></section>
    <section class="view" id="view-plan" hidden></section>
  </main>

  <button class="fab" id="fab" type="button" aria-label="Log spending" title="Log spending">+</button>

  <nav class="tabs"><div class="row">
    <button data-tab="home" aria-current="page"><span class="ic">🏠</span>Home</button>
    <button data-tab="activity"><span class="ic">🧾</span>Activity</button>
    <button data-tab="jars"><span class="ic">🫙</span>Jars</button>
    <button data-tab="accounts"><span class="ic">🏦</span>Accounts</button>
    <button data-tab="plan"><span class="ic">💸</span>Paycheck</button>
  </div></nav>
</div>

<div id="modalHost"></div>
<div id="toastHost"></div>

<script>
(function(){
'use strict';
const SUPABASE_URL = 'https://xmewmjzaeltegqsvzrqh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vBTJAvdEn87JGi3YbTe-cw_WoZIZVUk';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const num = v => Number(v)||0;
const r2 = n => Math.round(n*100)/100;
const fmt = n => { const v=r2(num(n)); const s=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); return (v<0?'-$':'$')+s; };
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const monthOf = iso => String(iso).slice(0,7);
const monthName = m => { const [y,mo]=m.split('-').map(Number); return new Date(y,mo-1,1).toLocaleDateString('en-US',{month:'short',year:'numeric'}); };
const monthLong = m => { const [y,mo]=m.split('-').map(Number); return new Date(y,mo-1,1).toLocaleDateString('en-US',{month:'long'}); };
const shiftMonth = (m,d) => { const [y,mo]=m.split('-').map(Number); const dt=new Date(y,mo-1+d,1); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); };
const dayLabel = iso => { const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); };
const ordinal = n => { const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
const PASTELS=['t-pink','t-lav','t-mint','t-butter','t-peach','t-sky','t-lilac'];
const GRP_COLOR={Spending:'var(--p-pink)',Bills:'var(--p-lav)',Subscriptions:'var(--p-lilac)'};
const GROUPS=['Spending','Bills','Subscriptions'];

let state = { tab:'home', month: monthOf(todayISO()), data:null, calc:null, actFilter:'all' };
try { const t = localStorage.getItem('pb_tab4'); if (t) state.tab = t; } catch(e){}

function toast(msg, ms=2200){ const h=$('#toastHost'); h.innerHTML=`<div class="toast">${esc(msg)}</div>`; clearTimeout(h._t); h._t=setTimeout(()=>h.innerHTML='',ms); }

/* ---------- Auth ---------- */
async function initAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  if (session) showApp(); else showAuth();
  sb.auth.onAuthStateChange((ev, s) => { if (s && $('#appView').hidden) showApp(); if (!s && !$('#appView').hidden) showAuth(); });
}
function showAuth(){ $('#authView').hidden=false; $('#appView').hidden=true; }
function authMsg(text, kind){ const m=$('#authMsg'); m.hidden=!text; m.textContent=text||''; m.className='msg'+(kind?' '+kind:''); }
$('#authForm').addEventListener('submit', async e => {
  e.preventDefault(); authMsg('Signing in…');
  const { error } = await sb.auth.signInWithPassword({ email: $('#authEmail').value.trim(), password: $('#authPass').value });
  if (error) { authMsg(error.message.includes('Email not confirmed') ? 'Email not confirmed yet. Tap the link in the email from Supabase, then sign in again.' : error.message, 'err'); return; }
  authMsg('');
});
$('#btnSignUp').addEventListener('click', async () => {
  const email=$('#authEmail').value.trim(), password=$('#authPass').value;
  if (!email || password.length<6) { authMsg('Enter your email and a password of at least 6 characters, then tap Create account.', 'err'); return; }
  authMsg('Creating account…');
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) { authMsg(error.message, 'err'); return; }
  if (data.session) { authMsg(''); return; }
  authMsg('Account created. Check your email for a confirmation link from Supabase, tap it, then come back and sign in.', 'ok');
});
async function showApp(){ $('#authView').hidden=true; $('#appView').hidden=false; await loadAll(); }

/* ---------- Data ---------- */
async function loadAll(){
  const lm=$('#loadMsg'); lm.hidden=false; lm.className='msg'; lm.textContent='Loading…';
  const qs = {
    accounts: sb.from('pb_accounts').select('*').order('sort'),
    jars: sb.from('pb_jars').select('*').order('sort'),
    transactions: sb.from('pb_transactions').select('*').order('date',{ascending:false}).order('id',{ascending:false}),
    moves: sb.from('pb_jar_moves').select('*').order('date',{ascending:false}).order('id',{ascending:false}),
    transfers: sb.from('pb_paycheck_transfers').select('*').order('sort'),
    settings: sb.from('pb_settings').select('*'),
  };
  const keys=Object.keys(qs); const res = await Promise.all(keys.map(k=>qs[k]));
  const err = res.find(r=>r.error);
  if (err) { lm.className='msg err'; lm.textContent='Could not load: '+err.error.message; return; }
  const data={}; keys.forEach((k,i)=>data[k]=res[i].data||[]);
  data.settingsMap = Object.fromEntries(data.settings.map(s=>[s.key, s.value]));
  lm.hidden=true;
  state.data=data; recompute(); render();
}
const setting = k => state.data.settingsMap[k] ?? '';
const perCheck = j => j.per_paycheck!=null && j.per_paycheck!=='' ? num(j.per_paycheck) : r2(num(j.monthly)/2);

function recompute(){
  const d=state.data; const c={}; const m=state.month;
  // Account balances: opening + ins − outs (credit cards: owed = opening + outs − ins)
  const ins={}, outs={};
  d.transactions.forEach(t=>{ const a=num(t.amount);
    if (t.kind==='spend'){ outs[t.account]=(outs[t.account]||0)+a; }
    else if (t.kind==='refund'||t.kind==='income'){ ins[t.account]=(ins[t.account]||0)+a; }
    else if (t.kind==='transfer'){ outs[t.account]=(outs[t.account]||0)+a; if (t.to_account) ins[t.to_account]=(ins[t.to_account]||0)+a; }
  });
  c.accounts = d.accounts.filter(a=>a.active).map(a=>{ const net=(ins[a.name]||0)-(outs[a.name]||0); const balance=r2(a.kind==='credit'? num(a.opening)-net : num(a.opening)+net); return {...a, balance, usable:r2(a.kind==='credit'? -balance : balance-num(a.reserve))}; });
  c.pot = r2(c.accounts.filter(a=>a.in_pot).reduce((s,a)=>s+a.usable,0));
  c.cash = r2(c.accounts.filter(a=>a.kind==='cash').reduce((s,a)=>s+a.balance,0));
  c.savings = r2(c.accounts.filter(a=>a.kind==='savings').reduce((s,a)=>s+a.balance,0));
  c.owed = r2(c.accounts.filter(a=>a.kind==='credit').reduce((s,a)=>s+a.balance,0));
  // Jars: opening + Σ moves
  const mv={}; d.moves.forEach(x=>{ mv[x.jar]=(mv[x.jar]||0)+num(x.amount); });
  const mt=d.transactions.filter(t=>monthOf(t.date)===m);
  c.jars = d.jars.filter(j=>j.active).map((j,i)=>{
    const spentM = r2(mt.filter(t=>t.jar===j.name).reduce((s,t)=>s+(t.kind==='spend'?num(t.amount):t.kind==='refund'?-num(t.amount):0),0));
    const paidTx = mt.find(t=>t.kind==='spend'&&t.jar===j.name);
    return {...j, balance:r2(num(j.opening)+(mv[j.name]||0)), perCheck:perCheck(j), spentM, paid:!!paidTx, paidAmount:paidTx?num(paidTx.amount):0, color:PASTELS[i%PASTELS.length]};
  });
  c.jarsTotal = r2(c.jars.reduce((s,j)=>s+j.balance,0));
  c.spendingTotal = r2(c.jars.filter(j=>j.grp==='Spending').reduce((s,j)=>s+j.balance,0));
  c.setAside = r2(c.jarsTotal - c.spendingTotal);
  c.unassigned = r2(c.pot - c.jarsTotal);
  c.bills = c.jars.filter(j=>j.grp!=='Spending');
  c.unpaid = c.bills.filter(b=>!b.paid && num(b.monthly)>0);
  c.spentM = r2(mt.filter(t=>t.kind==='spend').reduce((s,t)=>s+num(t.amount),0) - mt.filter(t=>t.kind==='refund').reduce((s,t)=>s+num(t.amount),0));
  c.incomeM = r2(mt.filter(t=>t.kind==='income').reduce((s,t)=>s+num(t.amount),0));
  c.transfersPlan = d.transfers.filter(t=>t.active);
  c.perCheckJars = r2(c.jars.reduce((s,j)=>s+j.perCheck,0));
  c.perCheckTransfers = r2(c.transfersPlan.reduce((s,t)=>s+num(t.amount),0));
  c.paycheck = num(setting('paycheck_amount'));
  c.leftover = r2(c.paycheck - c.perCheckJars - c.perCheckTransfers);
  c.isCurrentMonth = m===monthOf(todayISO());
  state.calc=c;
}

/* ---------- Render ---------- */
function render(){
  $('#monthLabel').textContent = monthName(state.month);
  $$('nav.tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===state.tab?'page':'false'));
  $$('section.view').forEach(s=>s.hidden = s.id!=='view-'+state.tab);
  ({home:renderHome, activity:renderActivity, jars:renderJars, accounts:renderAccounts, plan:renderPlan})[state.tab]();
  window.scrollTo({top:0});
}
const jarName = j => j.name;
function jarCard(j){
  const sub = j.grp==='Spending' ? (j.perCheck?`+${fmt(j.perCheck)} per check`:'no auto top-up') : `${fmt(j.monthly)} a month`;
  return `<div class="jar ${j.color}" data-act="jar" data-id="${j.id}" role="button" tabindex="0"><div class="n">${esc(j.name)}</div><div class="v num ${j.balance<0?'neg':''}">${fmt(j.balance)}</div><div class="sub">${esc(sub)}</div></div>`;
}
function healthPill(c){
  if (Math.abs(c.unassigned)<0.005) return `<span class="pill ok">Every dollar is in a jar</span>`;
  if (c.unassigned>0) return `<span class="pill info">${fmt(c.unassigned)} not in a jar yet</span>`;
  return `<span class="pill over">Jars are ${fmt(-c.unassigned)} more than you have</span>`;
}

function activityItems(){
  const d=state.data; const m=state.month;
  const accByName=Object.fromEntries(state.calc.accounts.map(a=>[a.name,a]));
  const items=[];
  d.transactions.filter(t=>monthOf(t.date)===m).forEach(t=>{
    const base={date:t.date, id:'t'+t.id, created:t.created_at, raw:t, type:'tx'};
    if (t.kind==='spend') items.push({...base, k:'spent', title:t.note||t.jar||'Spent', sub:`${t.jar||'No jar'} · ${t.account}`, amount:-num(t.amount)});
    else if (t.kind==='refund') items.push({...base, k:'spent', title:t.note||'Refund', sub:`Refund to ${t.jar||'no jar'} · ${t.account}`, amount:num(t.amount), cls:'in'});
    else if (t.kind==='income'){ const n=d.moves.filter(x=>x.tx_id===t.id).length; items.push({...base, k:'paid', title:t.note||'Paycheck', sub:`${t.account}${n?' · split into '+n+(n===1?' jar':' jars'):''}`, amount:num(t.amount), cls:'in'}); }
    else items.push({...base, k:'moved', title:t.note||`${t.account} → ${t.to_account}`, sub:(accByName[t.to_account]?.kind==='credit'?'Card payment':'Transfer')+` · ${t.account} → ${t.to_account}`, amount:num(t.amount), cls:'xfer'});
  });
  d.moves.filter(x=>!x.tx_id && monthOf(x.date)===m).forEach(x=>items.push({date:x.date, id:'m'+x.id, created:x.created_at, raw:x, type:'move', k:'moved', title:x.note||(num(x.amount)>=0?'Added to '+x.jar:'Taken from '+x.jar), sub:`Jar: ${x.jar}`, amount:num(x.amount), cls:'xfer'}));
  items.sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:(a.created<b.created?1:-1));
  return items;
}

/* ---------- Modal ---------- */
function openModal(title, fieldsHTML, onSave, opts={}){
  const host=$('#modalHost');
  host.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><form class="sheet" id="modalForm">
    <h2>${esc(title)}</h2>${fieldsHTML}<div id="modalErr" class="msg err" hidden></div>
    <div class="foot">${opts.onDelete?'<button type="button" class="btn danger" id="modalDelete">Delete</button>':''}<span class="spacer"></span><button type="button" class="btn" id="modalCancel">Cancel</button><button type="submit" class="btn primary">${esc(opts.saveLabel||'Save')}</button></div>
  </form></div>`;
  const close=()=>host.innerHTML='';
  $('#modalCancel').onclick=close; host.querySelector('.modal').addEventListener('click',e=>{ if(e.target===e.currentTarget) close(); });
  const form=$('#modalForm');
  form.onsubmit=async e=>{ e.preventDefault(); const btn=form.querySelector('[type=submit]'); btn.disabled=true;
    try{ await onSave(new FormData(form), form); close(); } catch(err){ $('#modalErr').hidden=false; $('#modalErr').textContent=err.message||String(err); btn.disabled=false; } };
  if (opts.onDelete) $('#modalDelete').onclick=async()=>{ const b=$('#modalDelete'); if (b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='Tap again to delete'; return; } try{ await opts.onDelete(); close(); } catch(err){ $('#modalErr').hidden=false; $('#modalErr').textContent=err.message; } };
  if (opts.after) opts.after(form);
  const first=form.querySelector('input.big,input:not([type=hidden]):not([type=checkbox]),select'); if (first && window.innerWidth>700) first.focus();
}
const F = {
  text:(name,label,val='',extra='')=>`<div class="field"><label for="f_${name}">${esc(label)}</label><input id="f_${name}" name="${name}" value="${esc(val)}" ${extra}></div>`,
  num:(name,label,val='',extra='')=>`<div class="field"><label for="f_${name}">${esc(label)}</label><input id="f_${name}" name="${name}" type="number" step="0.01" inputmode="decimal" value="${esc(val)}" ${extra}></div>`,
  amount:(name,label,val='')=>`<div class="field"><label for="f_${name}">${esc(label)}</label><input id="f_${name}" class="big" name="${name}" type="number" step="0.01" inputmode="decimal" placeholder="0.00" value="${esc(val)}" required min="0.01"></div>`,
  date:(name,label,val)=>`<div class="field"><label for="f_${name}">${esc(label)}</label><input id="f_${name}" name="${name}" type="date" value="${esc(val)}" required></div>`,
  sel:(name,label,options,val)=>`<div class="field"><label for="f_${name}">${esc(label)}</label><select id="f_${name}" name="${name}">${options.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===val?'selected':''}>${esc(l)}</option>`;}).join('')}</select></div>`,
  area:(name,label,val='')=>`<div class="field"><label for="f_${name}">${esc(label)}</label><textarea id="f_${name}" name="${name}">${esc(val)}</textarea></div>`,
  check:(name,label,on)=>`<label class="check"><input type="checkbox" name="${name}" ${on?'checked':''}> <span>${esc(label)}</span></label>`,
};
const afterSave = async msg => { toast(msg); await loadAll(); };
const dbErr = r => { if (r.error) throw new Error(r.error.message); return r; };
const accountNames = kinds => state.calc.accounts.filter(a=>!kinds||kinds.includes(a.kind)).map(a=>a.name);
const jarNames = grp => state.calc.jars.filter(j=>!grp||j.grp===grp).map(j=>j.name);
const jarOpts = () => GROUPS.flatMap(g=>state.calc.jars.filter(j=>j.grp===g).map(j=>[j.name, `${j.name} (${fmt(j.balance)})`]));

/* Spent / refund. t = existing tx to edit, or {_prefill} for a new prefilled one */
function spendForm(t, kind){
  const isNew=!t||!!t._prefill; kind = kind || (t&&t.kind)||'spend';
  t = t || {date:todayISO(), amount:'', jar:jarNames('Spending')[0]||'', account:'Chase Checking', note:''};
  const html=`
    <div class="kind" style="grid-template-columns:1fr 1fr"><button type="button" data-kind="spend" aria-pressed="${kind==='spend'}"><span>🛍️</span>Spent</button><button type="button" data-kind="refund" aria-pressed="${kind==='refund'}"><span>↩️</span>Refund</button></div>
    ${F.amount('amount','Amount',t.amount)}
    ${F.sel('jar','Jar',jarOpts(),t.jar)}
    <div class="grid2">${F.sel('account','Paid with',accountNames(['cash','credit']),t.account)}${F.date('date','Date',t.date)}</div>
    ${F.text('note','What was it? (optional)',t.note,'placeholder="e.g. Publix"')}
    <input type="hidden" name="kind" value="${kind}">`;
  openModal(isNew?'Log spending':'Edit', html, async fd=>{
    const k=fd.get('kind'); const row={date:fd.get('date'), kind:k, account:fd.get('account'), jar:fd.get('jar'), amount:r2(num(fd.get('amount'))), note:fd.get('note').trim()};
    if (row.amount<=0) throw new Error('Enter an amount.');
    const signed = k==='refund'? row.amount : -row.amount;
    if (isNew){
      const r=dbErr(await sb.from('pb_transactions').insert(row).select().single());
      dbErr(await sb.from('pb_jar_moves').insert({date:row.date, jar:row.jar, amount:signed, note:row.note, tx_id:r.data.id}));
      await afterSave(k==='refund'?`Refund added to ${row.jar}`:`${fmt(row.amount)} out of ${row.jar}`);
    } else {
      dbErr(await sb.from('pb_transactions').update(row).eq('id',t.id));
      dbErr(await sb.from('pb_jar_moves').delete().eq('tx_id',t.id));
      dbErr(await sb.from('pb_jar_moves').insert({date:row.date, jar:row.jar, amount:signed, note:row.note, tx_id:t.id}));
      await afterSave('Updated');
    }
  }, { saveLabel:isNew?'Log it':'Save', onDelete: isNew?null: async()=>{ dbErr(await sb.from('pb_transactions').delete().eq('id',t.id)); await afterSave('Deleted'); },
    after: form=>{ form.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{ form.querySelectorAll('[data-kind]').forEach(x=>x.setAttribute('aria-pressed',x===b)); form.querySelector('[name=kind]').value=b.dataset.kind; }); } });
}

/* Paycheck: lands in an account, splits into jars, optional transfers */
function paidForm(){
  const c=state.calc; const amt=c.paycheck||'';
  const html=`
    ${F.amount('amount','Paycheck amount',amt)}
    <div class="grid2">${F.sel('account','Lands in',accountNames(['cash']),setting('paycheck_account')||'Chase Checking')}${F.date('date','Date',todayISO())}</div>
    <div class="card tint" style="background:var(--p-mint);padding:12px 14px"><div class="eyebrow">Left over → ${esc(setting('leftover_jar')||'Whatever Fund')}</div><div class="v num" id="leftover" style="font-family:var(--display);font-size:1.3rem">—</div><div class="sub">Everything below adds up to the paycheck. Change any amount.</div></div>
    ${GROUPS.map(g=>`<div class="group-title"><span class="dot" style="background:${GRP_COLOR[g]}"></span>${g}</div><div class="rows">${c.jars.filter(j=>j.grp===g).map(j=>`<div class="row-item"><div class="t">${esc(j.name)}</div><div class="d">has ${fmt(j.balance)}</div><div class="a"><input class="split" name="jar_${j.id}" type="number" step="0.01" inputmode="decimal" value="${j.perCheck||''}" placeholder="0" style="width:96px;border:2px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--bg);text-align:right;font-weight:800"></div></div>`).join('')}</div>`).join('')}
    ${c.transfersPlan.length?`<div class="group-title"><span class="dot" style="background:var(--p-sky)"></span>Transfers</div><div class="rows">${c.transfersPlan.map(t=>`<div class="row-item"><label class="check" style="grid-column:1"><input type="checkbox" class="split" name="xfer_${t.id}" value="${num(t.amount)}" checked> <span>${esc(t.name)} → ${esc(t.to_account)}</span></label><div class="a">${fmt(t.amount)}</div></div>`).join('')}</div>`:''}
    ${F.text('note','Note (optional)','Paycheck')}`;
  openModal('I got paid 💖', html, async fd=>{
    const amount=r2(num(fd.get('amount'))); if (amount<=0) throw new Error('Enter the paycheck amount.');
    const date=fd.get('date'), account=fd.get('account'), note=fd.get('note').trim()||'Paycheck';
    const splits=c.jars.map(j=>({jar:j.name, amount:r2(num(fd.get('jar_'+j.id)))})).filter(s=>s.amount>0);
    const xfers=c.transfersPlan.filter(t=>fd.get('xfer_'+t.id)).map(t=>({date, kind:'transfer', account, to_account:t.to_account, amount:r2(num(t.amount)), note:t.name}));
    const left=r2(amount - splits.reduce((s,x)=>s+x.amount,0) - xfers.reduce((s,x)=>s+x.amount,0));
    if (left<-0.004) throw new Error(`The splits are ${fmt(-left)} more than the paycheck.`);
    const lj=setting('leftover_jar')||'Whatever Fund';
    if (left>0.004){ const ex=splits.find(s=>s.jar===lj); if (ex) ex.amount=r2(ex.amount+left); else splits.push({jar:lj, amount:left}); }
    const r=dbErr(await sb.from('pb_transactions').insert({date, kind:'income', account, amount, note}).select().single());
    if (splits.length) dbErr(await sb.from('pb_jar_moves').insert(splits.map(s=>({date, jar:s.jar, amount:s.amount, note:'Paycheck', tx_id:r.data.id}))));
    if (xfers.length) dbErr(await sb.from('pb_transactions').insert(xfers));
    await afterSave(`Paycheck split into ${splits.length} jars${xfers.length?' + '+xfers.length+' transfers':''}`);
  }, { saveLabel:'Split it', after: form=>{
    const upd=()=>{ const fd=new FormData(form); let s=0; c.jars.forEach(j=>s+=num(fd.get('jar_'+j.id))); c.transfersPlan.forEach(t=>{ if(fd.get('xfer_'+t.id)) s+=num(t.amount); }); const left=r2(num(fd.get('amount'))-s); const el=form.querySelector('#leftover'); el.textContent=fmt(left); el.style.color=left<-0.004?'var(--warn)':''; };
    form.addEventListener('input',upd); upd(); } });
}

/* Edit an existing paycheck row (amount/date/account/note only) */
function incomeEdit(t){
  const html=`${F.amount('amount','Amount',t.amount)}<div class="grid2">${F.sel('account','Landed in',accountNames(['cash']),t.account)}${F.date('date','Date',t.date)}</div>${F.text('note','Note',t.note)}<div class="sub">The jar splits from this paycheck show under Moved. Deleting this paycheck also removes its splits.</div>`;
  openModal('Edit paycheck', html, async fd=>{ dbErr(await sb.from('pb_transactions').update({amount:r2(num(fd.get('amount'))), account:fd.get('account'), date:fd.get('date'), note:fd.get('note').trim()}).eq('id',t.id)); await afterSave('Updated'); },
   { onDelete: async()=>{ dbErr(await sb.from('pb_transactions').delete().eq('id',t.id)); await afterSave('Paycheck deleted'); } });
}

/* Move money between two jars */
function moveForm(){
  const names=jarOpts();
  const html=`${F.amount('amount','Amount')}<div class="grid2">${F.sel('from','From jar',names,names[0]?.[0])}${F.sel('to','To jar',names,names[1]?.[0])}</div><div class="grid2">${F.date('date','Date',todayISO())}${F.text('note','Note (optional)','')}</div>`;
  openModal('Move between jars', html, async fd=>{
    const a=r2(num(fd.get('amount'))), from=fd.get('from'), to=fd.get('to'), date=fd.get('date'), note=fd.get('note').trim();
    if (from===to) throw new Error('Pick two different jars.');
    dbErr(await sb.from('pb_jar_moves').insert([{date, jar:from, amount:-a, note:note||`To ${to}`},{date, jar:to, amount:a, note:note||`From ${from}`}]));
    await afterSave(`${fmt(a)} moved to ${to}`);
  }, { saveLabel:'Move' });
}
/* Add to / take from one jar, or edit a standalone move */
function adjustForm(x, jar){
  const isNew=!x; x = x || {date:todayISO(), jar:jar||jarNames()[0], amount:'', note:''};
  const dir = isNew ? 'add' : (num(x.amount)>=0?'add':'take');
  const html=`<div class="kind" style="grid-template-columns:1fr 1fr"><button type="button" data-dir="add" aria-pressed="${dir==='add'}"><span>➕</span>Add to jar</button><button type="button" data-dir="take" aria-pressed="${dir==='take'}"><span>➖</span>Take out</button></div>
    ${F.amount('amount','Amount',x.amount===''?'':Math.abs(num(x.amount)))}${F.sel('jar','Jar',jarOpts(),x.jar)}<div class="grid2">${F.date('date','Date',x.date)}${F.text('note','Note (optional)',x.note)}</div><input type="hidden" name="dir" value="${dir}">
    <div class="sub">This changes only the jar, not a bank account. Use it for starting balances and fixes.</div>`;
  openModal(isNew?'Adjust a jar':'Edit jar move', html, async fd=>{
    const a=r2(num(fd.get('amount'))); const row={date:fd.get('date'), jar:fd.get('jar'), amount:fd.get('dir')==='take'?-a:a, note:fd.get('note').trim()};
    if (isNew) dbErr(await sb.from('pb_jar_moves').insert(row)); else dbErr(await sb.from('pb_jar_moves').update(row).eq('id',x.id));
    await afterSave('Jar updated');
  }, { onDelete: isNew?null: async()=>{ dbErr(await sb.from('pb_jar_moves').delete().eq('id',x.id)); await afterSave('Deleted'); },
    after: form=>{ form.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{ form.querySelectorAll('[data-dir]').forEach(y=>y.setAttribute('aria-pressed',y===b)); form.querySelector('[name=dir]').value=b.dataset.dir; }); } });
}
/* Account to account (card payment, savings, etc.) */
function transferForm(t){
  const isNew=!t; t = t || {date:todayISO(), amount:'', account:'Chase Checking', to_account:accountNames(['credit'])[0]||'', note:''};
  const html=`${F.amount('amount','Amount',t.amount)}<div class="grid2">${F.sel('account','From',accountNames(),t.account)}${F.sel('to_account','To',accountNames(),t.to_account)}</div><div class="grid2">${F.date('date','Date',t.date)}${F.text('note','Note (optional)',t.note)}</div><div class="sub">Paying a credit card is a transfer to that card. Jars don't change.</div>`;
  openModal(isNew?'Transfer / pay a card':'Edit transfer', html, async fd=>{
    const row={date:fd.get('date'), kind:'transfer', account:fd.get('account'), to_account:fd.get('to_account'), amount:r2(num(fd.get('amount'))), note:fd.get('note').trim()};
    if (row.account===row.to_account) throw new Error('Pick two different accounts.');
    if (isNew) dbErr(await sb.from('pb_transactions').insert(row)); else dbErr(await sb.from('pb_transactions').update(row).eq('id',t.id));
    await afterSave(isNew?'Transfer logged':'Updated');
  }, { onDelete: isNew?null: async()=>{ dbErr(await sb.from('pb_transactions').delete().eq('id',t.id)); await afterSave('Deleted'); } });
}
function jarForm(j){
  const isNew=!j; j = j || {name:'', grp:'Spending', opening:0, monthly:'', per_paycheck:'', day_of_month:'', pay_from:'Chase Checking', notes:'', sort:(state.data.jars.length+1)*10};
  const live = isNew?null: state.calc.jars.find(x=>x.id===j.id);
  const html=`${F.text('name','Name',j.name,'required')}${F.sel('grp','Type',GROUPS,j.grp)}
    <div class="grid2">${F.num('monthly','Monthly amount (bill price / savings goal)',j.monthly)}${F.num('per_paycheck','Per paycheck (blank = half of monthly)',j.per_paycheck??'')}</div>
    <div class="grid2">${F.num('day_of_month','Due day (bills)',j.day_of_month??'','min="1" max="31" step="1"')}${F.sel('pay_from','Usually paid with',['',...accountNames(['cash','credit'])],j.pay_from||'')}</div>
    ${F.text('notes','Notes',j.notes)}
    ${live?`<div class="sub">Jar has ${fmt(live.balance)}. To change that, use "Adjust a jar".</div>`:F.num('opening','Starting balance',j.opening)}`;
  openModal(isNew?'New jar':'Edit jar', html, async fd=>{
    const row={name:fd.get('name').trim(), grp:fd.get('grp'), monthly:r2(num(fd.get('monthly'))), per_paycheck:fd.get('per_paycheck')===''?null:r2(num(fd.get('per_paycheck'))), day_of_month:fd.get('day_of_month')===''?null:parseInt(fd.get('day_of_month'),10), pay_from:fd.get('pay_from')||null, notes:fd.get('notes').trim()};
    if (!row.name) throw new Error('Give the jar a name.');
    if (isNew){ row.opening=r2(num(fd.get('opening'))); row.sort=j.sort; dbErr(await sb.from('pb_jars').insert(row)); }
    else { dbErr(await sb.from('pb_jars').update(row).eq('id',j.id)); if (row.name!==j.name){ dbErr(await sb.from('pb_jar_moves').update({jar:row.name}).eq('jar',j.name)); dbErr(await sb.from('pb_transactions').update({jar:row.name}).eq('jar',j.name)); } }
    await afterSave(isNew?'Jar added':'Jar saved');
  }, { onDelete: isNew?null: async()=>{ dbErr(await sb.from('pb_jars').update({active:false}).eq('id',j.id)); await afterSave('Jar removed'); } });
}
function jarSheet(id){
  const j=state.calc.jars.find(x=>x.id===id); if(!j) return;
  const moves=state.data.moves.filter(x=>x.jar===j.name).slice(0,8);
  const html=`<div class="hero" style="padding:16px"><div class="eyebrow">${esc(j.grp)}</div><div class="big num ${j.balance<0?'neg':''}">${fmt(j.balance)}</div><div class="line"><span>${j.grp==='Spending'?(j.perCheck?'+'+fmt(j.perCheck)+' each paycheck':'No automatic top-up'):fmt(j.monthly)+' a month · '+fmt(j.perCheck)+' per check'}</span></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn primary" data-go="spend">Spent from it</button><button type="button" class="btn" data-go="adjust">Adjust</button><button type="button" class="btn" data-go="edit">Edit jar</button></div>
    <div><div class="eyebrow" style="margin-bottom:6px">Recent</div><div class="rows">${moves.map(x=>`<div class="row-item"><div class="t">${esc(x.note||(num(x.amount)>=0?'Added':'Spent'))}</div><div class="d">${esc(dayLabel(x.date))}</div><div class="a ${num(x.amount)>=0?'in':''}">${num(x.amount)>=0?'+':'-'}${fmt(Math.abs(num(x.amount)))}</div></div>`).join('')||'<div class="empty">No activity yet.</div>'}</div></div>`;
  openModal(j.name, html, async()=>{}, { saveLabel:'Done', after: form=>{ form.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ const g=b.dataset.go; $('#modalHost').innerHTML=''; if (g==='spend') spendForm({_prefill:true, date:todayISO(), amount:'', jar:j.name, account:j.pay_from||'Chase Checking', note:''}); else if (g==='adjust') adjustForm(null, j.name); else jarForm(j); }); } });
}
function accountForm(a){
  const isNew=!a; a = a || {name:'', kind:'cash', opening:0, reserve:0, in_pot:true, notes:'', sort:(state.data.accounts.length+1)*10};
  const live = isNew?null: state.calc.accounts.find(x=>x.id===a.id);
  const html=`${F.text('name','Name',a.name,'required')}${F.sel('kind','Type',[['cash','Checking / cash'],['savings','Savings / investment'],['credit','Credit card']],a.kind)}
    <div class="grid2">${F.num('opening',isNew?'Starting balance (cards: amount owed)':'Starting balance (cards: owed)',a.opening)}${F.num('reserve','Minimum to keep',a.reserve)}</div>
    ${F.check('in_pot','Counts toward money in the pot',a.in_pot)}${F.text('notes','Notes',a.notes)}
    ${live?`<div class="sub">Balance now ${fmt(live.balance)} (starting balance plus everything logged).</div>`:''}`;
  openModal(isNew?'New account':'Edit account', html, async fd=>{
    const row={name:fd.get('name').trim(), kind:fd.get('kind'), opening:r2(num(fd.get('opening'))), reserve:r2(num(fd.get('reserve'))), in_pot:!!fd.get('in_pot'), notes:fd.get('notes').trim()};
    if (isNew){ row.sort=a.sort; dbErr(await sb.from('pb_accounts').insert(row)); }
    else { dbErr(await sb.from('pb_accounts').update(row).eq('id',a.id)); if (row.name!==a.name){ dbErr(await sb.from('pb_transactions').update({account:row.name}).eq('account',a.name)); dbErr(await sb.from('pb_transactions').update({to_account:row.name}).eq('to_account',a.name)); } }
    await afterSave('Account saved');
  }, { onDelete: isNew?null: async()=>{ dbErr(await sb.from('pb_accounts').update({active:false}).eq('id',a.id)); await afterSave('Account hidden'); } });
}
function transferRuleForm(t){
  const isNew=!t; t = t || {name:'', to_account:accountNames(['savings'])[0]||'', amount:'', sort:(state.data.transfers.length+1)*10};
  const html=`${F.text('name','Name',t.name,'required placeholder="e.g. Student loans"')}${F.sel('to_account','Goes to',accountNames(),t.to_account)}${F.num('amount','Amount each paycheck',t.amount)}`;
  openModal(isNew?'New paycheck transfer':'Edit transfer', html, async fd=>{
    const row={name:fd.get('name').trim(), to_account:fd.get('to_account'), amount:r2(num(fd.get('amount')))};
    if (isNew){ row.sort=t.sort; dbErr(await sb.from('pb_paycheck_transfers').insert(row)); } else dbErr(await sb.from('pb_paycheck_transfers').update(row).eq('id',t.id));
    await afterSave('Saved');
  }, { onDelete: isNew?null: async()=>{ dbErr(await sb.from('pb_paycheck_transfers').update({active:false}).eq('id',t.id)); await afterSave('Removed'); } });
}
function settingsForm(){
  const html=`${F.num('paycheck_amount','Usual paycheck (take-home)',setting('paycheck_amount'))}${F.sel('paycheck_account','Paychecks land in',accountNames(['cash']),setting('paycheck_account'))}${F.sel('leftover_jar','Leftovers go to',jarNames(),setting('leftover_jar'))}`;
  openModal('Paycheck settings', html, async fd=>{
    const rows=['paycheck_amount','paycheck_account','leftover_jar'].map(k=>({key:k, value:String(fd.get(k)??'')}));
    dbErr(await sb.from('pb_settings').upsert(rows)); await afterSave('Saved');
  });
}
function changePassForm(){
  openModal('Change password', `${F.text('p1','New password','','type="password" minlength="6" required')}${F.text('p2','Again','','type="password" minlength="6" required')}`, async fd=>{
    if (fd.get('p1')!==fd.get('p2')) throw new Error('Passwords do not match.');
    const { error } = await sb.auth.updateUser({ password: fd.get('p1') }); if (error) throw new Error(error.message); toast('Password changed');
  });
}
function payBill(id){
  const b=state.calc.jars.find(j=>j.id===id); if(!b) return;
  spendForm({_prefill:true, date:todayISO(), amount:num(b.monthly), jar:b.name, account:b.pay_from||'Chase Checking', note:b.name}, 'spend');
}
function editItem(id){
  if (id[0]==='m'){ const x=state.data.moves.find(m=>'m'+m.id===id); if (x) adjustForm(x); return; }
  const t=state.data.transactions.find(r=>'t'+r.id===id); if(!t) return;
  if (t.kind==='spend'||t.kind==='refund') spendForm(t); else if (t.kind==='income') incomeEdit(t); else transferForm(t);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const tabBtn=e.target.closest('[data-tab]'); if (tabBtn){ state.tab=tabBtn.dataset.tab; try{localStorage.setItem('pb_tab4',state.tab);}catch(_){} render(); return; }
  const go=e.target.closest('[data-tab-go]'); if (go){ state.tab=go.dataset.tabGo; render(); return; }
  const f=e.target.closest('[data-filter]'); if (f){ state.actFilter=f.dataset.filter; renderActivity(); return; }
  const el=e.target.closest('[data-act]'); if (!el) return;
  const act=el.dataset.act, id=el.dataset.id;
  const acts={
    spent:()=>spendForm(null,'spend'), paid:()=>paidForm(), moved:()=>moveForm(), adjust:()=>adjustForm(),
    pay:()=>payBill(+id), jar:()=>jarSheet(+id), 'new-jar':()=>jarForm(), account:()=>accountForm(state.data.accounts.find(a=>a.id===+id)), 'new-account':()=>accountForm(),
    transfer:()=>transferForm(), 'transfer-rule':()=>transferRuleForm(state.data.transfers.find(t=>t.id===+id)), 'new-transfer':()=>transferRuleForm(),
    settings:()=>settingsForm(), edit:()=>editItem(id), 'change-pass':()=>changePassForm(), signout:()=>sb.auth.signOut(),
  };
  if (acts[act]) acts[act]();
});
document.addEventListener('keydown', e => { if (e.key==='Enter' && e.target.matches('.jar[role=button]')) e.target.click(); });
$('#fab').addEventListener('click', ()=>spendForm(null,'spend'));
$('#prevMonth').addEventListener('click', ()=>{ state.month=shiftMonth(state.month,-1); recompute(); render(); });
$('#nextMonth').addEventListener('click', ()=>{ state.month=shiftMonth(state.month,1); recompute(); render(); });

initAuth();
})();
</script>
</body>
