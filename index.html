<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hudi's Budget</title>
<meta name="description" content="Hudi's personal budget: safe-to-spend, ledger, monthly plan, savings jars and paycheck planner, backed by Supabase.">
<meta name="theme-color" content="#ffd6e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: phone-first single column (max 720px), soft pastel cards, big safe-to-spend hero, 3 quick-action buttons, bottom tabs. */
:root{
  --bg:#fff3f7; --surface:#ffffff; --surface-2:#ffe6ee; --fg:#3f2633; --muted:#8c6d7c; --line:#f6d5e0;
  --accent:#e85c8e; --accent-deep:#c9376c; --accent-soft:#ffd6e3; --accent-fg:#ffffff;
  --ok:#2e9c6c; --ok-soft:#d5f5e5; --warn:#d8405c; --warn-soft:#ffe0e6;
  --p-pink:#ffd6e3; --p-lav:#e7ddff; --p-mint:#d4f5e6; --p-butter:#fff1c2; --p-peach:#ffdcc7; --p-sky:#d6ecff; --p-lilac:#f2dcff;
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,sans-serif;
  --radius:20px; --shadow:0 2px 6px rgba(201,55,108,.06),0 10px 24px rgba(201,55,108,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#241a20; --surface:#302329; --surface-2:#3d2b34; --fg:#fbeff4; --muted:#c5a3b3; --line:#4a3540;
  --accent:#ff8ab5; --accent-deep:#ff6aa1; --accent-soft:#4d2b3a; --accent-fg:#2a1119;
  --ok:#7fe0b0; --ok-soft:#1f4634; --warn:#ff8a9f; --warn-soft:#4a2630;
  --p-pink:#4d2b3a; --p-lav:#3b3152; --p-mint:#1f4634; --p-butter:#4a4126; --p-peach:#4a3426; --p-sky:#263d52; --p-lilac:#45304f;
  --shadow:0 2px 6px rgba(0,0,0,.3),0 10px 24px rgba(0,0,0,.3); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#241a20; --surface:#302329; --surface-2:#3d2b34; --fg:#fbeff4; --muted:#c5a3b3; --line:#4a3540;
  --accent:#ff8ab5; --accent-deep:#ff6aa1; --accent-soft:#4d2b3a; --accent-fg:#2a1119;
  --ok:#7fe0b0; --ok-soft:#1f4634; --warn:#ff8a9f; --warn-soft:#4a2630;
  --p-pink:#4d2b3a; --p-lav:#3b3152; --p-mint:#1f4634; --p-butter:#4a4126; --p-peach:#4a3426; --p-sky:#263d52; --p-lilac:#45304f;
  --shadow:0 2px 6px rgba(0,0,0,.3),0 10px 24px rgba(0,0,0,.3); color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;font-weight:600}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em;font-weight:600}
h1{font-size:1.6rem}
h2{font-size:1.2rem}
h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-deep)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.sub{font-size:.82rem;color:var(--muted);font-weight:600}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
[hidden]{display:none!important}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);
  padding-block:12px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top .row{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
header.top h1{flex:1 1 auto}
header.top h1 span{color:var(--accent)}
.monthpick{display:flex;align-items:center;gap:2px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:2px 4px}
.monthpick button{border:0;background:transparent;width:32px;height:32px;border-radius:999px;cursor:pointer;color:var(--accent-deep);font-size:1.1rem;font-weight:800}
.monthpick button:hover{background:var(--accent-soft)}
.monthpick .label{font-family:var(--display);font-weight:600;font-size:.95rem;min-width:82px;text-align:center}

/* Main */
main{max-width:720px;margin:0 auto;padding-block:8px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
section.view{display:grid;gap:16px}
.card{background:var(--surface);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card.tint{box-shadow:none}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card-head .actions{display:flex;gap:6px}

/* Hero */
.hero{background:linear-gradient(135deg,var(--p-pink),var(--p-lav));border-radius:28px;padding:22px 20px 18px;box-shadow:var(--shadow);display:grid;gap:4px}
.hero .big{font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.hero .big.neg{color:var(--warn)}
.hero .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--fg);opacity:.85;font-weight:700}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}.tiles.three{grid-template-columns:repeat(3,1fr)}}
.tile{border-radius:18px;padding:12px 14px;min-width:0;display:grid;gap:2px;align-content:start}
.tile .v{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:1.3rem;font-weight:700;line-height:1.15}
.tile .v.neg{color:var(--warn)}
.tile .sub{font-size:.76rem}
.t-pink{background:var(--p-pink)} .t-lav{background:var(--p-lav)} .t-mint{background:var(--p-mint)} .t-butter{background:var(--p-butter)} .t-peach{background:var(--p-peach)} .t-sky{background:var(--p-sky)} .t-lilac{background:var(--p-lilac)}

/* Quick actions */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick button{border:0;border-radius:18px;padding:14px 8px 12px;cursor:pointer;display:grid;justify-items:center;gap:6px;font-weight:800;font-size:.9rem;color:var(--fg);box-shadow:var(--shadow);background:var(--surface)}
.quick button span.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem}
.quick button:hover{transform:translateY(-1px)}
.quick .spent .ic{background:var(--p-pink)} .quick .paid .ic{background:var(--p-mint)} .quick .moved .ic{background:var(--p-sky)}

/* Pills */
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:800;letter-spacing:.03em;vertical-align:middle}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.over{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--p-lav);color:var(--fg)}
.pill.hist{background:var(--surface-2);color:var(--muted)}

/* Lists & rows */
.rows{display:grid}
.row-item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;border-bottom:2px solid var(--line);align-items:center}
.row-item:last-child{border-bottom:0}
.row-item.click{cursor:pointer;margin:0 -8px;padding-inline:8px;border-radius:12px}
.row-item.click:hover{background:var(--surface-2)}
.row-item .t{font-weight:800}
.row-item .d{font-size:.8rem;color:var(--muted);grid-column:1}
.row-item .a{font-variant-numeric:tabular-nums;font-weight:800;text-align:right;grid-row:1/3;align-self:center;font-size:1.02rem}
.row-item .a.in{color:var(--ok)} .row-item .a.xfer{color:var(--muted)}
.row-item .a .sub{display:block;font-size:.74rem;font-weight:700}
.bar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:6px;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;min-width:0}
.bar i.over{background:var(--warn)}
.bar i.soft{background:var(--accent-deep)}
.group-title{display:flex;align-items:center;gap:8px;margin:14px 0 2px;font-family:var(--display);font-size:.95rem}
.group-title:first-child{margin-top:0}
.group-title .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.daysep{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;padding:12px 0 2px}
.empty{color:var(--muted);font-size:.92rem;padding:8px 0}
table.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;padding:6px 6px;border-bottom:2px solid var(--line)}
.tbl td{padding:9px 6px;border-bottom:2px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.total td{font-weight:800;border-top:3px solid var(--line)}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.scrollx{overflow-x:auto;margin:0 -6px}

/* Jars */
.jars{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.jars{grid-template-columns:repeat(3,1fr)}}
.jar{border-radius:18px;padding:12px 12px 10px;cursor:pointer;display:grid;gap:4px;align-content:start;min-width:0;position:relative;overflow:hidden}
.jar .n{font-weight:800;font-size:.9rem;line-height:1.2}
.jar .v{font-family:var(--display);font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.jar .v.neg{color:var(--warn)}
.jar .fill{height:8px;border-radius:999px;background:rgba(255,255,255,.6);overflow:hidden}
.jar .fill i{display:block;height:100%;background:var(--accent);border-radius:999px}
.jar .sub{font-size:.74rem}
:root[data-theme="dark"] .jar .fill, :root:not([data-theme="light"]) .jar .fill{background:rgba(0,0,0,.25)}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]) .jar .fill{background:rgba(255,255,255,.6)} }
:root[data-theme="light"] .jar .fill{background:rgba(255,255,255,.6)}

/* Buttons & forms */
.btn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:800;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.danger{color:var(--warn);border-color:var(--warn-soft);background:var(--warn-soft)}
.btn.sm{padding:5px 11px;font-size:.8rem}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px solid var(--accent-soft);outline-offset:1px}
.field{display:grid;gap:5px}
.field label{font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select,.field textarea{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 12px;min-height:44px;font-weight:700}
.field input.big{font-family:var(--display);font-size:1.8rem;font-weight:700;min-height:60px;text-align:center}
.field textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
.toggle{display:flex;gap:6px;flex-wrap:wrap}
.toggle button{border:2px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:.85rem;font-weight:800}
.toggle button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.kind{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kind button{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 4px;cursor:pointer;display:grid;justify-items:center;gap:4px;font-size:.78rem;font-weight:800}
.kind button span{font-size:1.3rem}
.kind button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:800;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.check{display:flex;align-items:center;gap:10px;font-weight:700}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(63,38,51,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:640px){.modal{align-items:center;padding:20px}.modal .sheet{border-radius:26px}}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.modal .foot .spacer{flex:1}
.msg{border-radius:14px;padding:10px 12px;font-size:.9rem;background:var(--p-lav)}
.msg.err{background:var(--warn-soft);color:var(--warn)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:30;box-shadow:var(--shadow);font-weight:800}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--line);z-index:9;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
nav.tabs .row{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:transparent;padding:8px 4px 8px;cursor:pointer;color:var(--muted);display:grid;justify-items:center;gap:3px;font-size:.7rem;font-weight:800}
nav.tabs button span.ic{width:38px;height:28px;border-radius:999px;display:grid;place-items:center;font-size:1.15rem}
nav.tabs button[aria-current="page"]{color:var(--accent-deep)}
nav.tabs button[aria-current="page"] span.ic{background:var(--accent-soft)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;width:58px;height:58px;font-size:2rem;line-height:1;cursor:pointer;box-shadow:0 8px 20px rgba(201,55,108,.35);font-weight:700}
.fab:hover{background:var(--accent-deep)}

.chart svg{display:block;max-width:100%;font-family:var(--body)}

/* Auth */
.auth{max-width:420px;margin:10vh auto 0;display:grid;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth .brand{display:flex;align-items:center;gap:12px}
.auth .brand img{width:56px;height:56px;border-radius:16px}
.notes p{margin:0 0 10px;font-weight:600}
.notes b{font-family:var(--display);font-weight:600}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(14px);opacity:.5}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<div id="authView" class="auth" hidden>
  <div class="brand"><img src="apple-touch-icon.png" alt=""><div><h1>Hudi's Budget</h1><div class="sub">Your money, in one cute place</div></div></div>
  <form id="authForm" class="card" style="display:grid;gap:12px">
    <div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="username" required placeholder="you@example.com"></div>
    <div class="field"><label for="authPass">Password</label><input id="authPass" type="password" autocomplete="current-password" required minlength="6"></div>
    <div id="authMsg" class="msg" hidden></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" type="submit" id="btnSignIn">Sign in</button>
      <button class="btn" type="button" id="btnSignUp">Create account</button>
    </div>
    <div class="sub">Only your own emails can see this data.</div>
  </form>
</div>

<div id="appView" hidden>
  <header class="top"><div class="row">
    <h1 id="greeting">Hi <span>Hudi</span></h1>
    <div class="monthpick" aria-label="Month">
      <button id="prevMonth" type="button" aria-label="Previous month">‹</button>
      <div class="label" id="monthLabel">—</div>
      <button id="nextMonth" type="button" aria-label="Next month">›</button>
    </div>
  </div></header>

  <main>
    <div id="loadMsg" class="msg" hidden></div>
    <section class="view" id="view-home"></section>
    <section class="view" id="view-activity" hidden></section>
    <section class="view" id="view-budget" hidden></section>
    <section class="view" id="view-jars" hidden></section>
    <section class="view" id="view-plan" hidden></section>
  </main>

  <button class="fab" id="fab" type="button" aria-label="Add" title="Add">+</button>

  <nav class="tabs"><div class="row">
    <button data-tab="home" aria-current="page"><span class="ic">🏠</span>Home</button>
    <button data-tab="activity"><span class="ic">🧾</span>Activity</button>
    <button data-tab="budget"><span class="ic">📊</span>Budget</button>
    <button data-tab="jars"><span class="ic">🫙</span>Jars</button>
    <button data-tab="plan"><span class="ic">💸</span>Plan</button>
  </div></nav>
</div>

<div id="modalHost"></div>
<div id="toastHost"></div>

<script>
(function(){
'use strict';
const SUPABASE_URL = 'https://xmewmjzaeltegqsvzrqh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vBTJAvdEn87JGi3YbTe-cw_WoZIZVUk';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const num = v => Number(v)||0;
const r2 = n => Math.round(n*100)/100;
const fmt = n => { const v=r2(num(n)); const s=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); return (v<0?'-$':'$')+s; };
const fmt0 = n => { const v=Math.round(num(n)); return (v<0?'-$':'$')+Math.abs(v).toLocaleString('en-US'); };
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const monthOf = iso => iso.slice(0,7);
const monthName = m => { const [y,mo]=m.split('-').map(Number); return new Date(y,mo-1,1).toLocaleDateString('en-US',{month:'short',year:'numeric'}); };
const monthLong = m => { const [y,mo]=m.split('-').map(Number); return new Date(y,mo-1,1).toLocaleDateString('en-US',{month:'long'}); };
const shiftMonth = (m,d) => { const [y,mo]=m.split('-').map(Number); const dt=new Date(y,mo-1+d,1); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); };
const dayLabel = iso => { const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); };
const ordinal = n => { const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
const PASTELS=['t-pink','t-lav','t-mint','t-butter','t-peach','t-sky','t-lilac'];
const GROUP_COLORS={'Housing & bills':'var(--p-lav)','Car':'var(--p-sky)','Food':'var(--p-mint)','Home & personal':'var(--p-pink)','Subscriptions':'var(--p-lilac)','Debt & savings':'var(--p-butter)','Fun':'var(--p-peach)','Unbudgeted':'var(--surface-2)'};
const groupColor = g => GROUP_COLORS[g] || 'var(--p-pink)';

let state = { tab:'home', month: monthOf(todayISO()), data:null, calc:null, actFilter:'all' };
try { const t = localStorage.getItem('pb_tab2'); if (t) state.tab = t; } catch(e){}

function toast(msg, ms=2200){ const h=$('#toastHost'); h.innerHTML=`<div class="toast">${esc(msg)}</div>`; clearTimeout(h._t); h._t=setTimeout(()=>h.innerHTML='',ms); }

/* ---------- Auth ---------- */
async function initAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  if (session) showApp(); else showAuth();
  sb.auth.onAuthStateChange((ev, s) => { if (s && $('#appView').hidden) showApp(); if (!s && !$('#appView').hidden) showAuth(); });
}
function showAuth(){ $('#authView').hidden=false; $('#appView').hidden=true; }
function authMsg(text, kind){ const m=$('#authMsg'); m.hidden=!text; m.textContent=text||''; m.className='msg'+(kind?' '+kind:''); }
$('#authForm').addEventListener('submit', async e => {
  e.preventDefault(); authMsg('Signing in…');
  const { error } = await sb.auth.signInWithPassword({ email: $('#authEmail').value.trim(), password: $('#authPass').value });
  if (error) { authMsg(error.message.includes('Email not confirmed') ? 'Email not confirmed yet. Tap the link in the email from Supabase, then sign in again.' : error.message, 'err'); return; }
  authMsg('');
});
$('#btnSignUp').addEventListener('click', async () => {
  const email=$('#authEmail').value.trim(), password=$('#authPass').value;
  if (!email || password.length<6) { authMsg('Enter your email and a password of at least 6 characters, then tap Create account.', 'err'); return; }
  authMsg('Creating account…');
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) { authMsg(error.message, 'err'); return; }
  if (data.session) { authMsg(''); return; }
  authMsg('Account created. Check your email for a confirmation link from Supabase, tap it, then come back and sign in.', 'ok');
});
async function showApp(){ $('#authView').hidden=true; $('#appView').hidden=false; await loadAll(); }

/* ---------- Data ---------- */
async function loadAll(){
  const lm=$('#loadMsg'); lm.hidden=false; lm.className='msg'; lm.textContent='Loading…';
  const qs = {
    accounts: sb.from('pb_accounts').select('*').order('sort'),
    transactions: sb.from('pb_transactions').select('*').order('date',{ascending:false}).order('id',{ascending:false}),
    categories: sb.from('pb_categories').select('*').order('sort'),
    funds: sb.from('pb_funds').select('*').order('sort'),
    allocations: sb.from('pb_allocations').select('*').order('date',{ascending:false}).order('id',{ascending:false}),
    settings: sb.from('pb_settings').select('*').order('sort'),
    notes: sb.from('pb_notes').select('*').order('sort'),
    bills: sb.from('pb_bills').select('*').order('sort'),
  };
  const keys=Object.keys(qs); const res = await Promise.all(keys.map(k=>qs[k]));
  const err = res.find(r=>r.error);
  if (err) { lm.className='msg err'; lm.textContent='Could not load: '+err.error.message; return; }
  const data={}; keys.forEach((k,i)=>data[k]=res[i].data||[]);
  data.settingsMap = Object.fromEntries(data.settings.map(s=>[s.key, s]));
  lm.hidden=true;
  state.data=data; recompute(); render();
}
const setting = k => num(state.data.settingsMap[k]?.value);

function recompute(){
  const d=state.data; const c={};
  const live = d.transactions.filter(t=>!t.historical);
  c.balance={}; d.accounts.forEach(a=>c.balance[a.name]=0);
  live.forEach(t=>{ if (t.to_account in c.balance) c.balance[t.to_account]+=num(t.amount); if (t.from_account in c.balance) c.balance[t.from_account]-=num(t.amount); });
  for (const k in c.balance) c.balance[k]=r2(c.balance[k]);
  c.cashAccounts=d.accounts.filter(a=>a.kind==='cash'&&a.active);
  c.creditAccounts=d.accounts.filter(a=>a.kind==='credit'&&a.active);
  c.otherAccounts=d.accounts.filter(a=>a.kind==='excluded'&&a.active);
  c.totalCash=r2(c.cashAccounts.reduce((s,a)=>s+c.balance[a.name],0));
  c.cardDebt=r2(c.creditAccounts.reduce((s,a)=>s+Math.max(0,-c.balance[a.name]),0));
  c.cashLessDebt=r2(c.totalCash-c.cardDebt);
  c.reserves=r2(c.cashAccounts.filter(a=>a.in_spendable).reduce((s,a)=>s+num(a.min_reserve),0));
  c.liquid=r2(c.cashAccounts.filter(a=>a.in_spendable).reduce((s,a)=>s+c.balance[a.name],0));
  c.cardExcluded=setting('card_promo_excluded');
  c.spendable=r2(c.liquid-c.reserves-(c.cardDebt-c.cardExcluded));
  c.funds=d.funds.filter(f=>f.active).map(f=>{
    const allocated=r2(d.allocations.filter(a=>a.fund===f.name).reduce((s,a)=>s+num(a.amount),0));
    const cats=new Set(f.spend_categories||[]);
    const spent=r2(live.filter(t=>cats.has(t.category)&&(t.type==='Expense'||t.type==='Refund')).reduce((s,t)=>s+(t.type==='Expense'?num(t.amount):-num(t.amount)),0));
    return {...f, allocated, spent, balance:r2(allocated-spent)};
  });
  c.earmarked=r2(c.funds.reduce((s,f)=>s+f.allocated,0));
  c.fundSpent=r2(c.funds.reduce((s,f)=>s+f.spent,0));
  c.earmarksAvail=r2(c.earmarked-c.fundSpent);
  c.reconDiff=r2(c.earmarksAvail-c.spendable);
  c.balanced=Math.abs(c.reconDiff)<0.01;
  const m=state.month; const mt=d.transactions.filter(t=>t.month===m);
  const expenseActual=cat=>r2(mt.filter(t=>t.category===cat&&(t.type==='Expense'||t.type==='Refund')).reduce((s,t)=>s+(t.type==='Expense'?num(t.amount):-num(t.amount)),0));
  const toAccountActual=acct=>r2(mt.filter(t=>t.to_account===acct&&(t.type==='Transfer'||t.type==='Income')).reduce((s,t)=>s+num(t.amount),0));
  c.budget=d.categories.filter(x=>x.active).map(x=>{
    const actual=x.actual_rule==='to_account'?toAccountActual(x.rule_account):expenseActual(x.name);
    const target=num(x.monthly_target); const remaining=r2(target-actual);
    return {...x, target, actual, remaining, over: remaining<-0.004};
  });
  const known=new Set(d.categories.map(x=>x.name)); known.add('Opening balance'); known.add('Paycheck');
  const extra={}; mt.forEach(t=>{ if ((t.type==='Expense'||t.type==='Refund')&&!known.has(t.category)) extra[t.category]=(extra[t.category]||0)+(t.type==='Expense'?num(t.amount):-num(t.amount)); });
  c.budgetExtra=Object.entries(extra).map(([name,actual])=>({name,actual:r2(actual)}));
  c.takeHome=setting('biweekly_take_home'); c.dad=setting('dad_monthly');
  c.monthIncome=r2(c.takeHome*2+c.dad);
  c.totalAllocated=r2(c.budget.filter(b=>b.in_total).reduce((s,b)=>s+b.target,0));
  c.cushion=r2(c.monthIncome-c.totalAllocated);
  c.monthSpent=r2(c.budget.filter(b=>b.actual_rule==='expense').reduce((s,b)=>s+b.actual,0)+c.budgetExtra.reduce((s,b)=>s+b.actual,0));
  c.monthPlannedSpend=r2(c.budget.filter(b=>b.in_total&&b.actual_rule==='expense').reduce((s,b)=>s+b.target,0));
  c.monthIncomeActual=r2(mt.filter(t=>t.type==='Income'&&!t.historical).reduce((s,t)=>s+num(t.amount),0));
  c.plan=c.budget.filter(b=>b.in_total&&b.target>0).map(b=>({...b, perCheck: b.per_paycheck!=null?num(b.per_paycheck):r2(b.target/2)}));
  c.planTotal=r2(c.plan.reduce((s,p)=>s+p.perCheck,0));
  c.planGap=r2(c.takeHome-c.planTotal);
  const hysa=d.accounts.find(a=>/hysa/i.test(a.name)); c.hysaName=hysa?hysa.name:null; c.hysaBal=hysa?c.balance[hysa.name]:0;
  const hysaCat=d.categories.find(x=>x.actual_rule==='to_account'&&x.rule_account===c.hysaName); c.hysaMonthly=hysaCat?num(hysaCat.monthly_target):0;
  c.hysa12=r2(c.hysaBal+12*c.hysaMonthly);
  c.extraCheck=setting('extra_paycheck_estimate'); c.afterPayoff=r2(c.extraCheck-c.cardExcluded);
  c.roth=r2(live.filter(t=>t.to_account==='Roth IRA'&&t.type==='Transfer').reduce((s,t)=>s+num(t.amount),0));
  c.commissionNet=r2(live.filter(t=>t.type==='Income'&&/commission/i.test(t.category)).reduce((s,t)=>s+num(t.amount),0));
  c.tdSavingsNet=r2(c.balance['TD Savings']||0);
  // Jars split + the health check
  c.jarsSpending=r2(c.funds.filter(f=>f.grp==='Sinking fund').reduce((s,f)=>s+f.balance,0));
  c.jarsBills=r2(c.funds.filter(f=>f.grp!=='Sinking fund').reduce((s,f)=>s+f.balance,0));
  c.unassigned=r2(c.spendable-c.earmarksAvail);
  // Week + pacing
  const today=todayISO(); const curMonth=monthOf(today);
  c.isCurrentMonth=(m===curMonth);
  const [yy,mm]=m.split('-').map(Number); const daysInMonth=new Date(yy,mm,0).getDate();
  c.daysLeft=c.isCurrentMonth?Math.max(1,daysInMonth-Number(today.slice(8))+1):(m<curMonth?0:daysInMonth);
  const tnow=new Date(); const dow=(tnow.getDay()+6)%7; const wkStart=new Date(tnow.getFullYear(),tnow.getMonth(),tnow.getDate()-dow); const wkEnd=new Date(wkStart.getFullYear(),wkStart.getMonth(),wkStart.getDate()+6);
  const iso=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  c.weekStart=iso(wkStart); c.weekEnd=iso(wkEnd);
  c.weekSpent=r2(d.transactions.filter(t=>t.date>=c.weekStart&&t.date<=c.weekEnd&&(t.type==='Expense'||t.type==='Refund')).reduce((s,t)=>s+(t.type==='Expense'?num(t.amount):-num(t.amount)),0));
  c.billCats=new Set((d.bills||[]).filter(b=>b.active).map(b=>b.category));
  c.pace=c.budget.filter(b=>b.actual_rule==='expense'&&b.target>0&&!c.billCats.has(b.name)&&['Food','Home & personal'].includes(b.grp)).map(b=>({...b, perDay: c.daysLeft>0?r2(b.remaining/c.daysLeft):0}));
  // Bills for the viewed month
  c.bills=(d.bills||[]).filter(b=>b.active).map(b=>{ const paid=mt.find(t=>t.type==='Expense'&&t.category===b.category); return {...b, paid:!!paid, paidAmount:paid?num(paid.amount):0}; });
  // Trends: spending per month, and last month per category
  const byMonth={}; d.transactions.forEach(t=>{ if(t.type==='Expense'||t.type==='Refund') byMonth[t.month]=(byMonth[t.month]||0)+(t.type==='Expense'?num(t.amount):-num(t.amount)); });
  c.trend=Object.keys(byMonth).sort().map(k=>({month:k,total:r2(byMonth[k])}));
  const prevM=shiftMonth(m,-1); const pt=d.transactions.filter(t=>t.month===prevM);
  c.prevActual={}; c.budget.forEach(b=>{ c.prevActual[b.name]=b.actual_rule==='to_account'?r2(pt.filter(t=>t.to_account===b.rule_account&&(t.type==='Transfer'||t.type==='Income')).reduce((s,t)=>s+num(t.amount),0)):r2(pt.filter(t=>t.category===b.name&&(t.type==='Expense'||t.type==='Refund')).reduce((s,t)=>s+(t.type==='Expense'?num(t.amount):-num(t.amount)),0)); });
  c.prevMonthHasData=pt.length>0; c.prevMonth=prevM;
  c.movers=c.prevMonthHasData?c.budget.filter(b=>b.actual_rule==='expense').map(b=>({name:b.name,now:b.actual,prev:c.prevActual[b.name],diff:r2(b.actual-c.prevActual[b.name])})).filter(x=>Math.abs(x.diff)>0.004).sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff)).slice(0,5):[];
  // Paycheck transfers
  c.planTransfers=c.plan.filter(p=>p.actual_rule==='to_account'&&p.rule_account);
  // Month close
  const lastClosed=(d.settingsMap.last_closed_month?.value||'');
  c.monthClosed=!!lastClosed&&m<=lastClosed;
  c.canClose=!c.monthClosed&&(m<curMonth||(c.isCurrentMonth&&c.daysLeft<=3))&&live.some(t=>t.month===m);
  c.whatever=c.funds.find(f=>/whatever/i.test(f.name));
  c.closeMoves=[]; if(c.whatever){ c.funds.filter(f=>!f.rollover&&f.name!==c.whatever.name&&f.balance>0.004).forEach(f=>c.closeMoves.push({from:f.name,amount:f.balance})); if(c.unassigned>0.004) c.closeMoves.push({from:null,amount:c.unassigned}); }
  state.calc=c;
}

/* ---------- Render ---------- */
function render(){
  $$('nav.tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===state.tab?'page':'false'));
  ['home','activity','budget','jars','plan'].forEach(v=>$('#view-'+v).hidden=v!==state.tab);
  $('#monthLabel').textContent=monthName(state.month);
  if (!state.calc) return;
  renderHome(); renderActivity(); renderBudget(); renderJars(); renderPlan();
}

function renderHome(){
  const c=state.calc, d=state.data; const el=$('#view-home');
  const over=c.budget.filter(b=>b.over);
  const spentPct=c.monthPlannedSpend>0?Math.min(100,c.monthSpent/c.monthPlannedSpend*100):0;
  const top=c.budget.filter(b=>b.actual_rule==='expense'&&(b.target>0||b.actual>0)).sort((a,b)=>(b.actual/(b.target||1))-(a.actual/(a.target||1))).slice(0,5);
  const jars=c.funds.filter(f=>f.grp==='Sinking fund').slice(0,6);
  const due=c.bills.filter(b=>!b.paid);
  const okUn=Math.abs(c.unassigned)<0.01;
  el.innerHTML=`
  <div class="hero">
    <div class="eyebrow">In your spending jars</div>
    <div class="big ${c.jarsSpending<0?'neg':''}">${fmt(c.jarsSpending)}</div>
    <div class="line"><span>Bills &amp; rent set aside ${fmt0(c.jarsBills)}</span><span class="pill ${okUn?'ok':'over'}">${okUn?'✓ Every dollar has a jar':(c.unassigned>0?fmt(c.unassigned)+' unassigned':fmt(-c.unassigned)+' spent outside jars')}</span></div>
  </div>
  <div class="quick">
    <button class="spent" data-act="add-kind" data-kind="spent"><span class="ic">🛍️</span>I spent</button>
    <button class="paid" data-act="add-kind" data-kind="paid"><span class="ic">💗</span>I got paid</button>
    <button class="moved" data-act="add-kind" data-kind="moved"><span class="ic">🔁</span>I moved money</button>
  </div>
  ${c.canClose?`<div class="card tint" style="background:var(--p-lav)"><div class="card-head"><h2>Close out ${esc(monthLong(state.month))}?</h2><button class="btn primary sm" data-act="close-month">Close month</button></div><div class="sub">Sweeps unused electricity and waxing money${c.unassigned>0.004?' and '+fmt(c.unassigned)+' of unassigned cash':''} into Whatever. Every other jar keeps its balance.</div></div>`:''}
  <div class="tiles">
    <div class="tile t-mint"><div class="eyebrow">Cash total</div><div class="v">${fmt0(c.totalCash)}</div><div class="sub">incl. savings</div></div>
    <div class="tile t-sky"><div class="eyebrow">Savings</div><div class="v">${fmt0(c.hysaBal)}</div><div class="sub">${esc(c.hysaName||'HYSA')}</div></div>
    <div class="tile t-peach"><div class="eyebrow">Cards owed</div><div class="v ${c.cardDebt>c.cardExcluded+0.004?'neg':''}">${fmt0(c.cardDebt)}</div><div class="sub">${fmt0(c.cardExcluded)} covered by Dec check</div></div>
    <div class="tile t-butter"><div class="eyebrow">${esc(monthLong(state.month))} spent</div><div class="v">${fmt0(c.monthSpent)}</div><div class="sub">of ${fmt0(c.monthPlannedSpend)} planned${over.length?' · <span class="pill over">'+over.length+' over</span>':''}</div><div class="bar" style="margin-top:8px"><i class="${spentPct>=100?'over':''}" style="width:${spentPct}%"></i></div></div>
  </div>
  ${due.length?`<div class="card"><div class="card-head"><h2>Bills to log</h2><span class="sub">${esc(monthName(state.month))}</span></div><div class="rows">${due.map(b=>`<div class="row-item"><div class="t">${esc(b.name)}</div><div class="d">${b.day_of_month?'Around the '+ordinal(b.day_of_month):'Sometime this month'}${b.notes?' · '+esc(b.notes):''}</div><div class="a"><button class="btn primary sm" data-act="pay-bill" data-id="${b.id}">Paid ${fmt0(b.amount)}</button></div></div>`).join('')}</div><div class="sub" style="margin-top:8px">Tap Paid, check the amount, save. Edit the list under Plan.</div></div>`:`<div class="card tint" style="background:var(--p-mint)"><div style="font-weight:800">✓ All ${esc(monthLong(state.month))} bills are logged</div></div>`}
  ${c.isCurrentMonth?`<div class="card"><div class="card-head"><h2>This week</h2><span class="sub">${esc(dayLabel(c.weekStart))} to ${esc(dayLabel(c.weekEnd))}</span></div>
    <div class="tiles" style="grid-template-columns:repeat(2,1fr);margin-bottom:8px"><div class="tile t-pink"><div class="eyebrow">Spent this week</div><div class="v">${fmt(c.weekSpent)}</div></div><div class="tile t-lilac"><div class="eyebrow">Days left in ${esc(monthLong(state.month))}</div><div class="v">${c.daysLeft}</div></div></div>
    <div class="rows">${c.pace.slice(0,6).map(p=>`<div class="row-item click" data-act="cat" data-id="${p.id}"><div class="t">${esc(p.name)}</div><div class="d">${p.remaining<0?'over by '+fmt(-p.remaining):fmt(p.remaining)+' left this month'}</div><div class="a ${p.remaining<0?'':'in'}" style="${p.remaining<0?'color:var(--warn)':''}">${fmt(Math.max(0,p.perDay))}<span class="sub">a day</span></div></div>`).join('')}</div></div>`:''}
  <div class="card">
    <div class="card-head"><h2>Where ${esc(monthLong(state.month))} is going</h2><button class="btn sm" data-tab-go="budget">See all</button></div>
    ${budgetRows(top,true)}
  </div>
  <div class="card">
    <div class="card-head"><h2>Your jars</h2><button class="btn sm" data-tab-go="jars">All jars</button></div>
    <div class="jars">${jars.map((f,i)=>jarCard(f,i)).join('')}</div>
  </div>
  <div class="card">
    <div class="card-head"><h2>Accounts</h2><button class="btn sm" data-act="edit-accounts">Edit</button></div>
    <div class="rows">
      ${c.cashAccounts.map(a=>`<div class="row-item click" data-act="acct" data-name="${esc(a.name)}"><div class="t">${esc(a.name)}</div><div class="d">${esc(a.notes||'')}</div><div class="a">${fmt(c.balance[a.name])}</div></div>`).join('')}
      ${c.creditAccounts.filter(a=>Math.abs(c.balance[a.name])>0.004||/sapphire|active cash/i.test(a.name)).map(a=>`<div class="row-item click" data-act="acct" data-name="${esc(a.name)}"><div class="t">${esc(a.name)} <span class="pill info">card</span></div><div class="d">${esc(a.notes||'')}</div><div class="a xfer">${fmt(Math.max(0,-c.balance[a.name]))}<span class="sub">owed</span></div></div>`).join('')}
      ${c.otherAccounts.map(a=>`<div class="row-item click" data-act="acct" data-name="${esc(a.name)}"><div class="t">${esc(a.name)} <span class="pill hist">not counted</span></div><div class="d">${esc(a.notes||'')}</div><div class="a xfer">${fmt(c.balance[a.name])}<span class="sub">net moved</span></div></div>`).join('')}
    </div>
  </div>
  <div class="card">
    <div class="card-head"><h2>Recent</h2><button class="btn sm" data-tab-go="activity">All activity</button></div>
    ${txRows(d.transactions.slice(0,5))}
  </div>`;
}

function jarCard(f,i){
  const pct=f.allocated>0?Math.min(100,Math.max(0,f.balance/f.allocated*100)):0;
  return `<div class="jar ${PASTELS[i%PASTELS.length]}" data-act="fund" data-id="${f.id}"><div class="n">${esc(f.name)}</div><div class="v ${f.balance<0?'neg':''}">${fmt(f.balance)}</div><div class="fill"><i style="width:${pct}%"></i></div><div class="sub">${f.spent>0?fmt0(f.spent)+' used of '+fmt0(f.allocated):(num(f.monthly_add)>0?'+'+fmt0(f.monthly_add)+' a month':'saved up')}</div></div>`;
}

function budgetRows(rows, compact){
  if (!rows.length) return '<div class="empty">Nothing here yet.</div>';
  return `<div class="rows">${rows.map(b=>{
    const pct=b.target>0?Math.min(100,Math.max(0,b.actual/b.target*100)):(b.actual>0?100:0);
    return `<div class="row-item click" data-act="cat" data-id="${b.id}"><div class="t">${esc(b.name)}${b.actual_rule==='to_account'?' <span class="pill info">transfer</span>':''}${b.over?' <span class="pill over">over</span>':''}</div>
      <div class="d">${compact?'':esc(b.details||'')}${b.target>0?(compact?'':' · ')+fmt(b.remaining)+' left':''}${!compact&&state.calc.prevMonthHasData?' · last month '+fmt(state.calc.prevActual[b.name]||0):''}</div>
      <div class="a">${fmt(b.actual)}<span class="sub">of ${fmt0(b.target)}</span></div>
      <div class="bar"><i class="${b.over?'over':''}" style="width:${pct}%"></i></div></div>`;}).join('')}</div>`;
}

function txRows(list){
  if (!list.length) return '<div class="empty">Nothing logged yet. Tap + to add something.</div>';
  let out='', lastDay='';
  list.forEach(t=>{
    if (t.date!==lastDay){ out+=`<div class="daysep">${esc(dayLabel(t.date))}</div>`; lastDay=t.date; }
    const dir=t.type==='Income'||t.type==='Refund'?'in':(t.type==='Transfer'||t.type==='Opening'?'xfer':'out');
    const sign=dir==='in'?'+':(dir==='out'?'−':'');
    const who=t.type==='Expense'?`${t.from_account}`:(t.type==='Income'||t.type==='Refund'?`into ${t.to_account}`:`${t.from_account} → ${t.to_account}`);

function trendChart(){
  const c=state.calc; const t=c.trend; if (t.length<2) return `<div class="empty">Trends show up once more than one month of spending is logged.</div>`;
  const W=560,H=210,padL=8,padR=8,padT=30,padB=30; const max=Math.max(...t.map(x=>x.total),1);
  const n=t.length; const slot=(W-padL-padR)/n; const bw=Math.min(48,slot*0.6);
  const bars=t.map((x,i)=>{ const h=Math.max(3,(H-padT-padB)*x.total/max); const xx=padL+i*slot+(slot-bw)/2; const y=H-padB-h; const cur=x.month===state.month;
    return `<g><title>${esc(monthName(x.month))}: ${fmt(x.total)}</title><rect x="${xx}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${cur?'var(--accent)':'var(--accent-soft)'}" stroke="var(--surface)" stroke-width="2"/><text x="${xx+bw/2}" y="${y-8}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--fg)">${fmt0(x.total)}</text><text x="${xx+bw/2}" y="${H-9}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">${esc(monthName(x.month))}</text></g>`; }).join('');
  const grid=[0.5,1].map(f=>{ const y=H-padB-(H-padT-padB)*f; return `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`; }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Spending by month">${grid}<line x1="${padL}" x2="${W-padR}" y1="${H-padB}" y2="${H-padB}" stroke="var(--line)" stroke-width="2"/>${bars}</svg></div>`;
}

function openModal(title, fieldsHTML, onSave, opts={}){
  const host=$('#modalHost');
  host.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><form class="sheet" id="modalForm">
    <h2>${esc(title)}</h2>${fieldsHTML}<div id="modalErr" class="msg err" hidden></div>
    <div class="foot">${opts.onDelete?'<button type="button" class="btn danger" id="modalDelete">Delete</button>':''}<span class="spacer"></span><button type="button" class="btn" id="modalCancel">Cancel</button><button type="submit" class="btn primary">${esc(opts.saveLabel||'Save')}</button></div>
  </form></div>`;
  const close=()=>host.innerHTML='';
  $('#modalCancel').onclick=close; host.querySelector('.modal').addEventListener('click',e=>{ if(e.target===e.currentTarget) close(); });
  const form=$('#modalForm');
  form.onsubmit=async e=>{ e.preventDefault(); const btn=form.querySelector('[type=submit]'); btn.disabled=true;
    try{ await onSave(new FormData(form), form); close(); } catch(err){ $('#modalErr').hidden=false; $('#modalErr').textContent=err.message||String(err); btn.disabled=false; } };
  if (opts.onDelete) $('#modalDelete').onclick=async()=>{ const b=$('#modalDelete'); if (b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='Tap again to delete'; return; } try{ await opts.onDelete(); close(); } catch(err){ $('#modalErr').hidden=false; $('#modalErr').textContent=err.message; } };
  if (opts.after) opts.after(form);
  const first=form.querySelector('input.big,input:not([type=hidden]):not([type=checkbox]),select'); if (first && window.innerWidth>700) first.focus();
}

    if (k==='paid') { const split=paySplit(); const isPay=!t.category||t.category==='Paycheck';
      return `${F.sel('to_account','Into',accountNames(['cash','excluded']),t.to_account==='External'?'Chase Checking':t.to_account)}<input type="hidden" name="from_account" value="External">

        ${F.sel('to_account','Back into',accountNames(['cash','credit']),t.to_account==='External'?'Chase Checking':t.to_account)}<input type="hidden" name="from_account" value="External">`;

  };
  openModal(isNew?'Add something':'Edit', html, async fd=>{
    const k=fd.get('kind'); const amount=Number(fd.get('amount'));
    const typeMap={spent:'Expense',paid:'Income',moved:'Transfer',refund:'Refund'};
    const row={date:fd.get('date'),amount,category:(fd.get('category')||'').trim(),description:(fd.get('description')||'').trim(),from_account:fd.get('from_account'),to_account:fd.get('to_account'),type:isNew?typeMap[k]:(fd.get('type')||typeMap[k])};

    if (k==='moved' && !row.category){ if (row.to_account==='TD Savings') row.category='Student loans'; else if (/hysa/i.test(row.to_account)) row.category='HYSA contribution'; else if (state.data.accounts.find(a=>a.name===row.to_account&&a.kind==='credit')) row.category='Card payment'; else row.category='Transfer'; }
    if (k==='paid' && !row.category) row.category='Paycheck';
    dbErr(isNew? await sb.from('pb_transactions').insert(row) : await sb.from('pb_transactions').update(row).eq('id',t.id));
    let extra='';
    if (isNew && k==='paid' && fd.get('split')){ const split=paySplit(); const rows=Object.entries(split).map(([f,a])=>({date:row.date,fund:f,amount:a,source:'Paycheck '+row.date,details:'Planner split'})); if (rows.length){ dbErr(await sb.from('pb_allocations').insert(rows)); extra=' and filled '+rows.length+' jars'; } }
    if (isNew && k==='paid'){ const xr=c.planTransfers.filter(p=>fd.get('xfer_'+p.id)).map(p=>({date:row.date,from_account:row.to_account,to_account:p.rule_account,type:'Transfer',category:p.name,amount:r2(p.perCheck),description:'From paycheck'})); if (xr.length){ dbErr(await sb.from('pb_transactions').insert(xr)); extra+=' + '+xr.length+' transfers'; } }
    await afterSave(isNew?({spent:'Logged',paid:'Paycheck logged'+extra,moved:'Transfer logged',refund:'Refund logged'})[k]:'Saved');
  },{ onDelete:isNew?null:async()=>{ dbErr(await sb.from('pb_transactions').delete().eq('id',t.id)); await afterSave('Deleted'); },
    after: form=>{
      const holder=form.querySelector('#kindFields'); const hidden=form.querySelector('[name=kind]');
      const setKind=k=>{ hidden.value=k; form.querySelectorAll('.kind button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.kind===k)); holder.innerHTML=fieldsFor(k);
        holder.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{ const inp=holder.querySelector('#f_category'); inp.value=ch.dataset.cat; holder.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===ch)); }));
        const inp=holder.querySelector('#f_category'); if (inp) inp.addEventListener('input',()=>holder.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.cat===inp.value))); };
      form.querySelectorAll('.kind button').forEach(b=>b.addEventListener('click',()=>setKind(b.dataset.kind)));
      setKind(kind); form.querySelector('[name=amount]').value=t.amount||'';
    } });
}

function allocForm(a){
  const isNew=!a; a=a||{date:todayISO(),fund:state.data.funds[0]?.name||'',amount:'',source:'',details:''};
  const html=`${F.amount('amount','How much')}${F.sel('fund','Which jar',state.data.funds.filter(f=>f.active).map(f=>f.name),a.fund)}
    <div class="grid2">${F.date('date','When',a.date)}${F.text('source','From where (optional)',a.source,'placeholder="e.g. Nov 18 paycheck"')}</div>${F.text('details','Note (optional)',a.details)}
    ${isNew?'<div class="sub">To take money back out of a jar, enter a negative amount.</div>':''}`;
  openModal(isNew?'Put money in a jar':'Edit jar entry', html, async fd=>{
    const row={date:fd.get('date'),fund:fd.get('fund'),amount:Number(fd.get('amount')),source:(fd.get('source')||'').trim(),details:(fd.get('details')||'').trim()};
    if (!row.amount) throw new Error('Enter an amount.');
    dbErr(isNew? await sb.from('pb_allocations').insert(row) : await sb.from('pb_allocations').update(row).eq('id',a.id));
    await afterSave(isNew?'Added to '+row.fund:'Saved');
  },{ onDelete:isNew?null:async()=>{ dbErr(await sb.from('pb_allocations').delete().eq('id',a.id)); await afterSave('Deleted'); },
      after: form=>{ form.querySelector('[name=amount]').removeAttribute('min'); form.querySelector('[name=amount]').value=a.amount||''; } });
}

function catForm(c){
  const isNew=!c; c=c||{name:'',monthly_target:0,per_paycheck:null,details:'',grp:'Home & personal',actual_rule:'expense',rule_account:'',in_total:true,sort:(state.data.categories.length+1),active:true};
  const grps=[...new Set(state.data.categories.map(x=>x.grp).filter(Boolean))];
  const html=`${F.text('name','Name',c.name,'required')}<div class="grid2">${F.num('monthly_target','Monthly target',c.monthly_target,'required')}${F.num('per_paycheck','Per paycheck (blank = half)',c.per_paycheck??'')}</div>
    <div class="field"><label for="f_grp">Group</label><input id="f_grp" name="grp" list="grplist" value="${esc(c.grp||'')}"><datalist id="grplist">${grps.map(g=>`<option value="${esc(g)}">`).join('')}</datalist></div>
    ${F.text('details','Details',c.details)}
    <div class="grid2">${F.sel('actual_rule','Actual counts',[['expense','Spending in this category'],['to_account','Money moved into an account']],c.actual_rule)}${F.sel('rule_account','Account (for transfers)',['',...state.data.accounts.map(a=>a.name)],c.rule_account||'')}</div>
    ${F.check('in_total','Part of the monthly plan total',c.in_total)}${isNew?'':F.check('active','Active',c.active)}`;
  openModal(isNew?'New budget line':'Edit budget line', html, async fd=>{
    const pp=fd.get('per_paycheck'); const row={name:fd.get('name').trim(),monthly_target:Number(fd.get('monthly_target'))||0,per_paycheck:pp===''?null:Number(pp),grp:(fd.get('grp')||'').trim(),details:(fd.get('details')||'').trim(),actual_rule:fd.get('actual_rule'),rule_account:fd.get('rule_account')||null,in_total:!!fd.get('in_total')};
    if (!isNew) row.active=!!fd.get('active'); else row.sort=c.sort;
    dbErr(isNew? await sb.from('pb_categories').insert(row) : await sb.from('pb_categories').update(row).eq('id',c.id));
    await afterSave('Saved');
  },{ onDelete:isNew?null:async()=>{ dbErr(await sb.from('pb_categories').delete().eq('id',c.id)); await afterSave('Deleted'); } });
}

function fundForm(f){
  const isNew=!f; f=f||{name:'',monthly_add:0,spend_categories:[],grp:'Sinking fund',notes:'',sort:(state.data.funds.length+1),active:true};
  const html=`${F.text('name','Jar name',f.name,'required')}<div class="grid2">${F.num('monthly_add','Add each month',f.monthly_add)}${F.sel('grp','Type',[['Sinking fund','Savings jar'],['Monthly earmark','Bill set aside']],f.grp)}</div>
    ${F.text('spend_categories','Spending that comes out of it (comma separated)',(f.spend_categories||[]).join(', '),'placeholder="defaults to the jar name"')}${F.text('notes','Notes',f.notes)}${isNew?'':F.check('active','Active',f.active)}`;
  openModal(isNew?'New jar':'Edit jar', html, async fd=>{
    const name=fd.get('name').trim(); let cats=(fd.get('spend_categories')||'').split(',').map(s=>s.trim()).filter(Boolean); if(!cats.length) cats=[name];
    const row={name,monthly_add:Number(fd.get('monthly_add'))||0,grp:fd.get('grp'),spend_categories:cats,notes:(fd.get('notes')||'').trim()};
    if (!isNew) row.active=!!fd.get('active'); else row.sort=f.sort;
    if (!isNew && name!==f.name) dbErr(await sb.from('pb_allocations').update({fund:name}).eq('fund',f.name));
    dbErr(isNew? await sb.from('pb_funds').insert(row) : await sb.from('pb_funds').update(row).eq('id',f.id));
    await afterSave('Saved');
  },{ onDelete:isNew?null:async()=>{ dbErr(await sb.from('pb_funds').delete().eq('id',f.id)); await afterSave('Deleted'); } });
}

function accountsForm(){
  const list=state.data.accounts;
  const html=`<div class="sub">Balances change through activity; this only sets how each account is treated.</div>
    <div class="scrollx"><table class="tbl"><thead><tr><th>Account</th><th>Kind</th><th>Spendable</th><th class="r">Keep</th></tr></thead><tbody>
    ${list.map(a=>`<tr><td>${esc(a.name)}</td><td><select name="kind_${a.id}">${['cash','credit','excluded'].map(k=>`<option ${a.kind===k?'selected':''}>${k}</option>`).join('')}</select></td><td><input type="checkbox" name="sp_${a.id}" ${a.in_spendable?'checked':''}></td><td class="r"><input type="number" step="0.01" name="min_${a.id}" value="${num(a.min_reserve)}" style="width:90px"></td></tr>`).join('')}
    </tbody></table></div>
    ${F.text('newname','Add an account (name)','')}`;
  openModal('Accounts', html, async fd=>{
    for (const a of list){ const row={kind:fd.get('kind_'+a.id),in_spendable:!!fd.get('sp_'+a.id),min_reserve:Number(fd.get('min_'+a.id))||0};
      if (row.kind!==a.kind||row.in_spendable!==a.in_spendable||row.min_reserve!==num(a.min_reserve)) dbErr(await sb.from('pb_accounts').update(row).eq('id',a.id)); }
    const nn=(fd.get('newname')||'').trim(); if (nn) dbErr(await sb.from('pb_accounts').insert({name:nn,kind:'cash',in_spendable:true,sort:list.length+1}));
    await afterSave('Accounts saved');
  });
}
function accountForm(name){
  const a=state.data.accounts.find(x=>x.name===name); if(!a) return;
  const html=`${F.text('name','Name',a.name,'required')}${F.sel('kind','Kind',[['cash','Cash (counts in total cash)'],['credit','Credit card (owed)'],['excluded','Not counted (loan / investment)']],a.kind)}
    <div class="grid2">${F.num('min_reserve','Always keep (reserve)',a.min_reserve)}<div class="field"><label>&nbsp;</label>${F.check('in_spendable','Counts as spendable',a.in_spendable)}</div></div>${F.text('notes','Notes',a.notes)}${F.check('active','Active',a.active)}`;
  openModal('Edit account', html, async fd=>{
    const row={name:fd.get('name').trim(),kind:fd.get('kind'),min_reserve:Number(fd.get('min_reserve'))||0,in_spendable:!!fd.get('in_spendable'),notes:(fd.get('notes')||'').trim(),active:!!fd.get('active')};
    if (row.name!==a.name){
      dbErr(await sb.from('pb_transactions').update({from_account:row.name}).eq('from_account',a.name));
      dbErr(await sb.from('pb_transactions').update({to_account:row.name}).eq('to_account',a.name));
      dbErr(await sb.from('pb_categories').update({rule_account:row.name}).eq('rule_account',a.name));
    }
    dbErr(await sb.from('pb_accounts').update(row).eq('id',a.id)); await afterSave('Saved');
  });
}
function settingForm(key){
  const s=state.data.settingsMap[key]; if(!s) return;
  openModal(s.label, `${F.text('value','Value',s.value,'required')}${F.text('notes','Notes',s.notes)}`, async fd=>{
    dbErr(await sb.from('pb_settings').update({value:fd.get('value').trim(),notes:(fd.get('notes')||'').trim()}).eq('key',key)); await afterSave('Saved'); });
}
function noteForm(n){
  const isNew=!n; n=n||{title:'',body:'',sort:(state.data.notes.length+1)};
  openModal(isNew?'Add note':'Edit note', `${F.text('title','Title',n.title,'required')}${F.area('body','Note',n.body)}`, async fd=>{
    const row={title:fd.get('title').trim(),body:(fd.get('body')||'').trim()}; if(isNew) row.sort=n.sort;
    dbErr(isNew? await sb.from('pb_notes').insert(row) : await sb.from('pb_notes').update(row).eq('id',n.id)); await afterSave('Saved');
  },{ onDelete:isNew?null:async()=>{ dbErr(await sb.from('pb_notes').delete().eq('id',n.id)); await afterSave('Deleted'); } });
}
function changePassForm(){
  openModal('Change password', `${F.text('p1','New password','','type="password" minlength="6" required autocomplete="new-password"')}${F.text('p2','Repeat it','','type="password" minlength="6" required autocomplete="new-password"')}`, async fd=>{
    if (fd.get('p1')!==fd.get('p2')) throw new Error('Passwords do not match.');
    const { error } = await sb.auth.updateUser({ password: fd.get('p1') }); if (error) throw new Error(error.message); toast('Password changed');
  });
}

function billForm(b){
  const isNew=!b; b=b||{name:'',amount:'',day_of_month:'',category:'',from_account:'Chase Checking',notes:'',active:true,sort:((state.data.bills||[]).length+1)};
  const cats=categoryList();
  const html=`${F.text('name','Bill',b.name,'required')}<div class="grid2">${F.num('amount','Usual amount',b.amount,'required')}${F.num('day_of_month','Day of month (optional)',b.day_of_month??'','min="1" max="31" step="1"')}</div>
    <div class="field"><label for="f_category">Budget category</label><input id="f_category" name="category" list="catlist" value="${esc(b.category)}" required><datalist id="catlist">${cats.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div>
    ${F.sel('from_account','Paid with',accountNames(['cash','credit']),b.from_account)}${F.text('notes','Notes',b.notes)}${isNew?'':F.check('active','Active',b.active)}`;
  openModal(isNew?'New bill':'Edit bill', html, async fd=>{
    const dm=fd.get('day_of_month'); const row={name:fd.get('name').trim(),amount:Number(fd.get('amount'))||0,day_of_month:dm===''?null:Number(dm),category:fd.get('category').trim(),from_account:fd.get('from_account'),notes:(fd.get('notes')||'').trim()};
    if (!isNew) row.active=!!fd.get('active'); else row.sort=b.sort;
    dbErr(isNew? await sb.from('pb_bills').insert(row) : await sb.from('pb_bills').update(row).eq('id',b.id)); await afterSave('Saved');
  },{ onDelete:isNew?null:async()=>{ dbErr(await sb.from('pb_bills').delete().eq('id',b.id)); await afterSave('Deleted'); } });
}
function payBill(id){
  const b=(state.data.bills||[]).find(x=>x.id===id); if(!b) return;
  const [y,m]=state.month.split('-').map(Number); const dim=new Date(y,m,0).getDate();
  const date=state.calc.isCurrentMonth?todayISO():state.month+'-'+String(Math.min(b.day_of_month||1,dim)).padStart(2,'0');
  txForm({date, amount:num(b.amount), category:b.category, description:b.name, from_account:b.from_account, to_account:'External', historical:false, type:'Expense', _prefill:true}, 'spent');
}
function closeMonthForm(){
  const c=state.calc; const m=state.month;
  if (!c.whatever) { toast('Add a jar named Whatever Fund first'); return; }
  const moves=c.closeMoves; const total=r2(moves.reduce((s,x)=>s+x.amount,0));
  const html=`<div class="msg">${moves.length?`Moving ${fmt(total)} into ${esc(c.whatever.name)}:`:'Nothing to sweep this month. Every jar keeps its balance.'}</div>
    ${moves.length?`<div class="rows">${moves.map(mv=>`<div class="row-item"><div class="t">${mv.from?esc(mv.from)+' leftover':'Unassigned cash'}</div><div class="a in">+${fmt(mv.amount)}</div></div>`).join('')}<div class="row-item"><div class="t">${esc(c.whatever.name)} after</div><div class="a">${fmt(r2(c.whatever.balance+total))}</div></div></div>`:''}
    ${c.unassigned<-0.004?`<div class="msg err">You spent ${fmt(-c.unassigned)} that no jar covered. Closing still works, but top up a jar so the numbers match.</div>`:''}
    <div class="sub">Wi-Fi, groceries, dining, travel and every other jar roll over untouched. The sweep shows up in Jar history and can be undone by deleting those entries.</div>`;
  openModal('Close '+monthName(m), html, async fd=>{
    const [y,mo]=m.split('-').map(Number); const last=m+'-'+String(new Date(y,mo,0).getDate()).padStart(2,'0');
    const rows=[]; moves.forEach(mv=>{ if(mv.from) rows.push({date:last,fund:mv.from,amount:-mv.amount,source:'Close '+monthName(m),details:'Unused, swept to '+c.whatever.name}); rows.push({date:last,fund:c.whatever.name,amount:mv.amount,source:'Close '+monthName(m),details:mv.from?'From '+mv.from:'Unassigned cash'}); });
    if (rows.length) dbErr(await sb.from('pb_allocations').insert(rows));
    dbErr(await sb.from('pb_settings').upsert({key:'last_closed_month',value:m,label:'Last closed month',notes:'Set automatically by Close month',sort:9}));
    await afterSave(monthName(m)+' closed');
  },{saveLabel:'Close '+monthLong(m)});
}

/* ---------- Events ---------- */
document.addEventListener('click', async e=>{
  const tab=e.target.closest('nav.tabs button'); if (tab){ state.tab=tab.dataset.tab; try{localStorage.setItem('pb_tab2',state.tab);}catch(x){} render(); window.scrollTo({top:0}); return; }
  const go=e.target.closest('[data-tab-go]'); if (go){ state.tab=go.dataset.tabGo; render(); window.scrollTo({top:0}); return; }
  const filt=e.target.closest('[data-filter]'); if (filt){ state.actFilter=filt.dataset.filter; renderActivity(); return; }
  const act=e.target.closest('[data-act]'); if (!act) return;
  const d=state.data; const id=Number(act.dataset.id);
  switch(act.dataset.act){
    case 'add-kind': txForm(null, act.dataset.kind); break;
    case 'tx': txForm(d.transactions.find(t=>t.id===id)); break;
    case 'add-alloc': allocForm(null); break;
    case 'alloc': allocForm(d.allocations.find(a=>a.id===id)); break;
    case 'add-cat': catForm(null); break;
    case 'cat': catForm(d.categories.find(c=>c.id===id)); break;
    case 'add-fund': fundForm(null); break;
    case 'fund': fundForm(d.funds.find(f=>f.id===id)); break;
    case 'edit-accounts': accountsForm(); break;
    case 'acct': accountForm(act.dataset.name); break;
    case 'setting': settingForm(act.dataset.key); break;
    case 'add-note': noteForm(null); break;
    case 'note': noteForm(d.notes.find(n=>n.id===id)); break;
    case 'pay-bill': payBill(id); break;
    case 'add-bill': billForm(null); break;
    case 'bill': billForm((d.bills||[]).find(b=>b.id===id)); break;
    case 'close-month': closeMonthForm(); break;
    case 'change-pass': changePassForm(); break;
    case 'signout': await sb.auth.signOut(); showAuth(); break;
  }
});
$('#fab').addEventListener('click',()=>txForm(null,'spent'));
$('#prevMonth').addEventListener('click',()=>{ state.month=shiftMonth(state.month,-1); recompute(); render(); });
$('#nextMonth').addEventListener('click',()=>{ state.month=shiftMonth(state.month,1); recompute(); render(); });
document.addEventListener('keydown',e=>{ if (e.key==='Escape') $('#modalHost').innerHTML=''; });
document.addEventListener('visibilitychange',()=>{ if (document.visibilityState==='visible' && state.data && !$('#appView').hidden) loadAll(); });

initAuth();
})();
</script>
